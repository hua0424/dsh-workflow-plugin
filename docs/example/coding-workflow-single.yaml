# 单仓 Milestone 两级 PR：节点各司其职，任务耗尽只由选票判断。
schemaVersion: agent-workflow/v3
actorCommonPersona: |
  只执行授权的单仓 Milestone，feature→milestone→基线两级 PR 均用 merge commit；不把进入 milestone 称为最终交付。信任前序已验收结果，按 handoff 做本节点工作，只核对当前操作对象、修订和结果，不重验上游或巡检全流程。
  GitHub Milestone 管任务集合，Issue 管规格、进度和证据，gh 显式指定仓库。按链接读取本节点需要的材料，不倾倒全历史或只凭最后一条评论。技术/权限/必需证据缺口、范围争议或需改子仓，用 node_block 带 handoff 交 Manager；新评论不自动扩大授权。
  保护用户内容和历史，不强推、硬重置、绕过保护、部署或自动删分支；只提交当前任务内容，原始 baseCommit 不用当前 tip 覆盖。重入只查询本节点操作，成功复用、遗漏补齐；结果未知先查询，不盲目重复写入。
  本票证据写实施 Issue，计划/集成证据写主 Issue（已关闭仍可使用）；评论绑定 workflowId/真实 runId、节点、对象/修订和前序链接，发布成功再交付，PR 留摘要及链接。多行正文用 --body-file；新结果追加并引用历史，不能用本地草稿冒充已发布评论。
  普通报告直接写 Issue，仅长篇复杂报告落 workspace 内 docs/dsh-workflow/runs/<runId>/ 或初始化目录，须已忽略且未跟踪；Issue 留关键结论、适用修订、workspace、绝对/相对路径和 SHA256，路径不是下载链接。仅 developer 在任务分支补必要忽略规则，其他角色用 Issue 分段或交 Manager；不预建运行台账、不取消跟踪或清理用户文件，不写敏感日志。
  handoff 在每次节点及子流程进出保留 runId、仓库/workspace、Milestone/主 Issue、初始化/最新计划链接、当前对象/证据、分支及必要修订；集成阶段附 completionSummary 和 pendingClosure，链接代替报告全文。实际可用技能按需使用，产物遵循本流程；claim 或 node_block 是本轮最后动作。
  环境故障首次出现时在主 Issue（无主票则当前唯一 Issue）登记环境标识、仓库/基线 SHA、失败用例与错误特征、对照证据、影响范围及已有补跑结果/明确例外依据；尚未处理则注明待补证或补跑缺口，后续 handoff 只传该评论链接。同环境且无相关变更时复用归因；环境、相关实现/测试/依赖或失败特征变化则补查。基线也失败不等于验证通过，不把失败写成不适用或自动豁免；仍须满足项目质量要求及冻结 criteria，必需检查未满足则 node_block 交 Manager。
roles:
  coordinator:
    persona: |
      按当前节点承担选票或合并收尾，不实现代码、不裁决审查。只有选票节点判断任务耗尽、关闭聚合票和维护就绪标签，不越过人工暂停/撤销。两级合并直接消费 approved handoff，不重读审查内容、不寻找反证、不决定重审；当前操作异常 node_block 给 Manager。最终收尾消费完成摘要，不重新扫描全部工单。
    model:
      provider: zai-coding-cn
      modelId: glm-5.3-flash
  planner:
    persona: |
      只规划集成审查明确要求的范围内修复，按实际可用 to-tickets 创建或复用 implementation 叶票，维护发现 ID→Issue 映射和主 Issue 计划。保留既有范围与完成历史，不重复建主票、不实现或合并。新增/变更依赖及聚合关系不得引入联合等待环，不得等待集成验收主票关闭；范围移出/取消需授权并同步验收归属、依赖及聚合子集。就绪标签交选票节点维护。
    model:
      provider: kimi-coding
      modelId: k3-256k
  developer:
    persona: |
      遵循 Ponytail 原则最小实现当前 implementation 叶票并完成适用自检/必要回归，只在指定 feature 分支提交推送，经同一 feature→milestone PR 交付，不合并关票或直接推 milestone/基线。返工先核实发现，成立则修复，不成立给绑定修订的具体反证交 reviewer 裁决，无代码变化不制造空提交。
      开发阶段完成自检和必要回归，默认不额外执行完整双轴 code-review；正式独立审查交 review 节点，用户或项目明确要求的额外审查保留。
    reuse: continuable
    model:
      provider: commandcode
      modelId: deepseek/deepseek-v4.1-flash
  code-reviewer:
    persona: |
      独立审查当前 PR 的实现和验收，实现只读，不合并关票。报告与裁决合一，发现逐项给证据和处置；无必修项且验证充分才批准，延期需必要授权及后续入口。结论绑定当前 PR/base/head/mergeBase；内部批准不代替仓库要求的 approval。集成审查聚焦基线变化、合并差异、跨票交互和整体验收，可复用逐票证据，无覆盖证据的部分补审；不重复票务完成判断。
    model:
      provider: kimi-coding
      modelId: k3
judgeRole:
  persona: |
    只读核验当前 claim 的共同及所选 result criteria，信任已验收的前序结果，不重复验收上游或扩展节点职责。事实支持 ACCEPT，明确不符 REJECT，必要信息不足 NEED_CONTEXT，不代 Actor 选结果。按 handoff 查询本节点对象及实际执行证据，不把 Actor/Manager 自述当独立事实。
    任务耗尽由选票节点验收；合并节点只验当前合并和收尾，不重判 review 或重查全量必交集。主 Issue 已关闭不自动构成失败；初始化前明确取消不要求尚未创建的资源。冻结 criteria 是边界，参考文档、本地短报告缺失不得新增门槛。
    只读约束针对操作，不限于名称带 inspect 的工具。按实际可见工具选择查询能力：inspection 不支持 PR/评论/提交关系，不代表全部工具都不支持；可通过可见命令工具只读查询 git/gh（API 使用 GET），不可写仓库或远端、修改环境，也不为核验执行会修改状态的测试。工具确实不可见、查询失败或事实不足时才 NEED_CONTEXT，一次列明缺失事实、对应对象/修订、已尝试查询及错误；未尝试须说明能力缺失原因，不虚构调用或反复尝试同一失败查询。
    核验本节点报告的对象/版本、覆盖范围、发现处置与可追溯证据是否一致，不默认再执行完整 code-review 或全量测试；评论存在、Actor 自述或 Manager 宣告均不能单独证明结论。前序已验收事实按适用版本复用，当前 PR 状态/head/目标/checks 等易变事实按本节点需要实时查询。明显矛盾按 criteria REJECT；补证只补缺口，不重查已满足且未变化的事实，合并/收尾不重新裁决上游审查。
    环境记录只支持适用范围内的归因，不自动免除验证；核对其环境/版本/用例与当前任务关系，不能把“基线也失败”判成通过。明确例外不得改写冻结 criteria，必需检查仍未满足则请求补证或处理。
  model:
    provider: zai-coding-cn
    modelId: glm-5.3-flash
  tools:
    deny:
      - edit
      - write
workflow:
  startNode: initialize-and-plan
  nodes:
    initialize-and-plan:
      execution:
        type: actor-task
        role: manager
        instruction: |
          1. 核验唯一 GitHub 仓库/workspace、工作树和索引干净，保留用户改动；有未提交内容先协调。明确主 Issue 规格、单仓验收/不做范围、基线、Milestone/分支名及创建/推送/两级合并/关票授权，已有明确决定沿用；需求不清用实际可用技能澄清。跨仓需求阻断，不未经授权建资源、强推、重置或部署。
          2. 取得真实 runId，fetch 并安全更新确认的基线，从确切 SHA 创建/推送或核验复用 milestone 分支，记录原始 baseCommit。创建/复用开放 Milestone 和唯一主 Issue；若基线不存在，先确认创建来源。重入查本次已有资源，不重复创建或接管归属不明对象。
          3. 一次完成规划：简单任务可用主票实施，复杂任务用 to-tickets 拆票，全部关联同仓 Milestone。implementation 是承担实现的叶票；aggregate 仅聚合、无独立验收；integration-acceptance 仅为有独立集成验收的主票，实现拆入叶票且它不得成为实施/聚合票等待关闭的依赖。父子关系及“显式依赖+聚合等待子票（含聚合自身依赖）”的联合等待图均无环。
          4. 主 Issue 发布初始化及计划（可同一评论）：workflowId/runId、仓库/workspace、规格/授权、分支/起点、merge commit 策略、任务 URL/分类/父子/依赖/验收归属/人工 hold。必交集以最新授权为准，获准移出/取消保留依据及历史并同步依赖、验收与聚合子集，不能仅移出 Milestone 或改标签排除。同步远端依赖；至少一张授权、无 hold、依赖满足的 implementation，标签统一交选票处理。
          5. 记录 GitHub Issue 跟踪、冻结配置为执行依据；普通证据不落本地，长报告才用 ignored 未跟踪 run 目录并在 Issue 登记摘要、修订、路径与哈希。评论成功发布才 ready，交接 runId、主 Issue/Milestone、初始化/计划链接、仓库/分支/起点、验收与约束。用户明确取消才 cancelled：记录可读取决定、资源现状和清理约束；未建资源时用用户确认记录，不为取消建票或自动清理，未回复/技术故障不算取消。
          环境记录：沿用已知环境/凭据故障的证据与获准处理方式；首次发现时在本次 Issue 记录环境、仓库/基线、失败特征、对照和处理入口，handoff 传链接，无已知故障不预建清单。不得记录凭据或把环境失败视为自动通过；项目质量要求和冻结 criteria 不变，未满足必需验证先协调。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        ready:
          criteria: |
            用户继续授权有效；范围/验收明确且仅同仓，Milestone/主 Issue 开放，本轮票均关联；milestone 分支从确认基线建立或可追溯复用并推送，原始起点保留，工作区干净。初始化/计划评论已发布，包含身份、授权、分支起点与完整验收归属；分类及联合等待图满足本节点约束，远端依赖一致，获准排除项有依据、无遗漏实现，至少一张授权无 hold 且依赖满足的可执行 implementation。handoff 含必要入口，无需预建本地文件或就绪标签。
          target:
            node: run-issue-cycle
        cancelled:
          criteria: |
            用户最新有效决定为明确取消，有独立可读取依据和资源现状/清理约束摘要，未伪称交付；初始化前不要求尚未建立的 Issue、Milestone、评论或本地材料，未回复/技术故障不算取消。
          target:
            return: cancelled
    run-issue-cycle:
      execution:
        type: child-workflow
        workflowId: issue-cycle
      onReturn:
        integration-ready:
          node: final-review
    final-review:
      execution:
        type: actor-task
        role: code-reviewer
        instruction: |
          1. 按集成准备 handoff 审查 milestone→基线 PR：覆盖基线变化、新增/合并差异、跨票交互、整体验收及 pendingClosure 中独立验收。消费 completionSummary，不重查各票是否完成；逐票已验收证据可引用，缺口和变化补审，不逐票重跑已通过的审查。即使只有一票也保留本次集成审查。使用实际可用 code-review，纯文档/注释小改可直接审查；固定当前 PR 的 base/head/mergeBase。
          2. 在主 Issue发布 rNNN 审查评论：修订、范围/方法、验收/验证覆盖、发现 ID/处置/依据、批准或可执行必修清单、延期边界与前序链接。首次 r001，输入/修订/结论变化开新轮，同执行同输入才复用。发布前后核对修订，漂移注明事实并 node_block。
          3. approved 记录 approvedBase/approvedHead；changes-required 明确本轮未批准、旧批准失效，技术/权限/范围争议不能伪装代码返工。PR 留结论和评论链接。
          approved：交接 PR/源目标分支、批准修订、merge commit 方式、审查链接及验证/延期边界，原样传递 completionSummary 和 pendingClosure，并给待关闭主票的集成验收依据。
          changes-required：交接当前 PR/修订、本轮发现 ID、可执行必修清单与验收给修复规划，旧完成摘要不可用于新一轮收尾。
      checker:
        checkerId: judge.claim-correct
        config:
          criteria: |
            主 Issue本轮审查评论已发布，绑定开放 PR/base/head/mergeBase 并覆盖本节点范围，旧必修项和反证已裁决，每项发现有处置/依据，延期有必要授权及后续入口。PR 引用本轮结论且提交时修订一致，handoff 可定位对象和结果。整体验收及独立集成验收有证据，不以重复逐票审查或票务扫描作为门槛。
      results:
        approved:
          criteria: |
            本轮无未解决必修项或缺失必需验证，approvedBase/approvedHead 与当前 PR 相符；handoff 含合并对象、源/目标分支、批准修订、审查链接及验证/延期边界。completionSummary、pendingClosure 和待关闭主票的集成验收依据已交接。
          target:
            node: close-milestone
        changes-required:
          criteria: |
            本轮有范围内、有依据且具可执行验收的必修清单，当前未批准且旧批准失效；环境/权限缺口不伪装返工。发现 ID 及验收足以规划修复票。
          target:
            node: plan-remediation
    close-milestone:
      execution:
        type: actor-task
        role: coordinator
        instruction: |
          1. 直接消费 approved handoff 的 PR/分支、approvedBase/approvedHead 和 merge commit 方式；审查链接仅作引用，不重读裁决或决定重审。查询当前 PR 状态；已合并只核实际结果并补收尾，不把正常推进后的目标 tip 与原 base 比较。使用交接的 completionSummary/pendingClosure，不重新扫描必交集或逐票查批准/合并证据。
          2. 开放 PR：核对操作对象和 base/head 与交接一致、仓库必需检查/保护满足；在主 Issue成功发布合并前记录（PR/修订、时间、merge commit、检查/保护证据和上游链接），紧邻执行核对修订并用 head 条件保护合入指定基线。对象/修订变化、冲突、检查/权限或策略不满足即 node_block 交 Manager，不自行回审查；head 条件不原子锁住 base。
          3. 核验实际源 head 匹配交接、mergeCommit 第一父等于 approvedBase、远端目标包含交接 head 和 mergeCommit；结果未知先查远端，不匹配或不能证明则 node_block，不自动回滚或手动关票，已自动关票如实记录。
          4. 主 Issue 发布集成交付评论，引用完成摘要、合并证据及上游验证/延期边界；仅按 pendingClosure 为待关闭主票登记集成验收依据并关闭，再关闭指定 Milestone，不重新判定是否还有未完成任务。已关闭对象核对本次操作记录后复用；安全切回并快进指定基线，保留分支和用户内容。
          delivered：交接交付/合并前评论、源/起点/mergeCommit、目标包含和关闭证据；重入只补本节点遗漏动作。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        delivered:
          criteria: |
            指定 PR 已以 merge commit 合入交接目标，源 head 与交接一致，合并前记录包含修订/时间/方式及必要检查保护证据；mergeCommit 第一父等于 approvedBase，远端目标包含交接 head/mergeCommit，有可核验依据。主 Issue 集成交付评论已发布并引用上游完成摘要与验收依据；pendingClosure 指定主票（如有）和 Milestone 已关闭。上游验证/延期边界已传递，工作区干净并位于指定基线，重入无重复副作用。只验本节点合并与收尾，不重判审查或重复必交集核验。
          target:
            return: delivered
    plan-remediation:
      execution:
        type: actor-task
        role: planner
        instruction: |
          1. 消费 final-review 的 changes-required，只为本轮范围内必修项按需用 to-tickets 创建/复用 implementation 修复票，关联同一 Milestone；按集成 PR/发现 ID/已有映射去重。关闭修复票有新复发事实则引用历史新建，不擅自重开原主票。
          2. 主 Issue 追加计划，保留既有任务及完成/授权历史，增加发现 ID→Issue、验收/依赖/hold；只校验本次增改引起的覆盖与联合等待关系，不从头重做规划。获准移出/取消须同步验收、依赖、聚合子集，实际变更需授权。至少一张授权无 hold、依赖满足的开放修复叶票；无明确必修目标、范围扩张或反复无新证据则 node_block。
          3. planned 交接新计划及本轮审查/映射入口，清除旧 completionSummary/pendingClosure，交选票重新判断本轮完成；标签解阻统一由选票执行，不要求本节点先标 ready-for-agent。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        planned:
          criteria: |
            本轮集成必修项已映射到同一 Milestone 的修复票，至少一张授权无 hold、依赖满足且验收清楚的开放 implementation；新计划评论保留既有范围/历史，无重复或无授权扩张，增改的验收归属与联合依赖合法。handoff 指向最新计划和本轮审查/映射，旧完成摘要不再作为本轮交付依据。
          target:
            node: run-issue-cycle
  returns:
    - delivered
    - cancelled
childWorkflows:
  issue-cycle:
    startNode: select-next-issue
    nodes:
      select-next-issue:
        execution:
          type: actor-task
          role: coordinator
          instruction: |
            1. 读取最新计划与本轮交付 handoff，分页核对开放 Milestone 的 Issue（排除 PR），处理成员、授权/hold 和依赖的变化；必交集非空且至少一张 implementation。信任本 run 已验收交付记录，只确认完成状态及对应记录入口，不重读审查或重做合并验证；外部关闭无交付依据、未授权移出/取消或身份冲突则 node_block。
            2. 必交子票及聚合自身依赖已完成关闭且无 hold 时，自底向上评论并关闭 aggregate。集中维护工作流来源的 ready-for-agent：仅授权、依赖满足且无人工 hold/needs-info/ready-for-human 的 implementation 可就绪；人工撤销或来源不明的标签不自动恢复。
            3. 从就绪的开放 implementation 叶票按依赖优先级、编号升序选择。安全更新 milestone，从确切 SHA 建立/推送 feature 分支；复用以原领取记录核对归属、原始 baseCommit 及祖先关系。当前票发布领取评论，交接分支/起点/本票验收，selected 进入实现。
            4. 无候选时完成本节点的结束判断：最新必交 implementation/aggregate 均有完成依据并关闭，获准排除项有依据且已移出，剩余开放票为空或仅登记的 integration-acceptance 主票；未就绪/hold/不明对象不能冒充耗尽。
            5. 耗尽后安全更新已推送的 milestone，创建/复用唯一 milestone→基线开放 PR；工作区干净、无未解释提交，外部关闭/合并或无交付差异 node_block。主 Issue 发布集成准备评论：completionSummary（计划版本、完成范围/逐票交付入口、排除依据）、pendingClosure（空或唯一待集成验收主票及验收项）、PR/base/head。integration-ready 交接此记录，不提前做集成审查。
        checker:
          checkerId: judge.claim-correct
          config: {}
        results:
          selected:
            criteria: |
              选中授权、无人工 hold、依赖满足且 ready-for-agent 的开放 implementation 叶票；成员/计划无未解释变化，本次标签/聚合操作有依据且未越过人工限制。feature 已从 milestone 的可追溯起点建立/复用并推送，领取评论及 handoff 含本票、分支和原始起点，未覆盖用户改动。
            target:
              node: deliver-one-issue
          integration-ready:
            criteria: |
              已完整分页核对最新必交集，非空 implementation 及 aggregate 全部有本 run 已验收交付/聚合完成依据并关闭；获准排除项有历史依据且已移出，无未解释对象或剩余未完成票，至多保留登记的集成验收主票。Milestone 仍开放，唯一集成 PR 源/目标及已推送修订正确，工作区干净。主 Issue 准备评论和 handoff 含 completionSummary、pendingClosure、PR/修订及计划入口；尚未要求集成验收通过。
            target:
              return: integration-ready
      deliver-one-issue:
        execution:
          type: child-workflow
          workflowId: issue-delivery
        onReturn:
          delivered:
            node: select-next-issue
    returns:
      - integration-ready
  issue-delivery:
    startNode: implement
    nodes:
      implement:
        execution:
          type: actor-task
          role: developer
          instruction: |
            1. 按领取 handoff 在指定 feature 实现本票验收；编码用实际可用 implement，按需 tdd/diagnosing-bugs，文档小改可直接处理。返工核实本轮必修项，逐项修复或给具体反证，不重新检查全量计划。
            2. 完成适用自测/必要回归，记录命令、对象 SHA、结果和未测边界；不适用有依据，必需验证不能执行则 node_block。只提交本任务内容及必要忽略规则，推送 feature，创建/更新同一 feature→milestone PR；PR 已关闭/合并或归属异常交 Manager。
            3. 本票发布实现评论：PR/base/head/实现 SHA、验收覆盖、自测、修复/反证及领取/上轮审查链接；PR 留摘要与链接。implemented 交接实现评论、修订和待审事项。
        checker:
          checkerId: judge.claim-correct
          config: {}
        results:
          implemented:
            criteria: |
              本票实现已提交推送，唯一开放 PR 源/目标为指定 feature/milestone，head 与证据一致，diff 不含无关用户改动或运行产物。适用自测/必要回归有真实结果或不适用依据，无缺失必需验证；返工项逐项有修复或待 reviewer 裁决的反证。实现评论已发布并被 PR 引用，handoff 保留本票/实现/修订及验证边界。
            target:
              node: review
      review:
        execution:
          type: actor-task
          role: code-reviewer
          instruction: |
            1. 按实现 handoff 审查 feature→milestone PR：覆盖本票验收、完整 diff、自测/回归及上轮必修项，逐项核实开发者反证；增量复用须补查变化和交互。使用实际可用 code-review，纯文档/注释小改可直接审查；固定当前 PR 的 base/head/mergeBase。
            2. 在本实施 Issue发布 rNNN 审查评论：修订、范围/方法、验收/验证覆盖、发现 ID/处置/依据、批准或可执行必修清单、延期边界与前序链接。首次 r001，输入/修订/结论变化开新轮，同执行同输入才复用。发布前后核对修订，漂移注明事实并 node_block。
            3. approved 记录 approvedBase/approvedHead；changes-required 明确本轮未批准、旧批准失效，技术/权限/范围争议不能伪装代码返工。PR 留结论和评论链接。
            approved：交接 PR/源目标分支、批准修订、merge commit 方式、审查链接、本票实现 SHA 及验证/延期边界。
            changes-required：交接当前 PR/修订、本轮发现 ID、可执行必修清单与验收。
        checker:
          checkerId: judge.claim-correct
          config:
            criteria: |
              本实施 Issue本轮审查评论已发布，绑定开放 PR/base/head/mergeBase 并覆盖本节点范围，旧必修项和反证已裁决，每项发现有处置/依据，延期有必要授权及后续入口。PR 引用本轮结论且提交时修订一致，handoff 可定位对象和结果。本实施 Issue 仍开放。
        results:
          approved:
            criteria: |
              本轮无未解决必修项或缺失必需验证，approvedBase/approvedHead 与当前 PR 相符；handoff 含合并对象、源/目标分支、批准修订、审查链接、本票实现 SHA 及验证/延期边界。
            target:
              node: complete-issue
          changes-required:
            criteria: |
              本轮有范围内、有依据且具可执行验收的必修清单，当前未批准且旧批准失效；环境/权限缺口不伪装返工。
            target:
              node: implement
      complete-issue:
        execution:
          type: actor-task
          role: coordinator
          instruction: |
            1. 直接消费 approved handoff 的 PR/分支、approvedBase/approvedHead 和 merge commit 方式；审查链接仅作引用，不重读裁决或决定重审。查询当前 PR 状态；已合并只核实际结果并补收尾，不把正常推进后的目标 tip 与原 base 比较。
            2. 开放 PR：核对操作对象和 base/head 与交接一致、仓库必需检查/保护满足；在本实施 Issue成功发布合并前记录（PR/修订、时间、merge commit、检查/保护证据和上游链接），紧邻执行核对修订并用 head 条件保护合入指定milestone 分支。对象/修订变化、冲突、检查/权限或策略不满足即 node_block 交 Manager，不自行回审查；head 条件不原子锁住 base。
            3. 核验实际源 head 匹配交接、mergeCommit 第一父等于 approvedBase、远端目标包含交接 head 和 mergeCommit及本票实现提交；结果未知先查远端，不匹配或不能证明则 node_block，不自动回滚或手动关票，已自动关票如实记录。
            4. 本实施 Issue 发布交付评论，记录合并证据并传递上游验证/延期边界，再关闭本票；不扫描其他票、关闭聚合票或维护解阻标签。已关闭对象核对本次操作记录后复用；安全切回并快进指定milestone 分支，保留分支和用户内容。
            delivered：交接交付/合并前评论、源/起点/mergeCommit、目标包含和关闭证据；重入只补本节点遗漏动作。
        checker:
          checkerId: judge.claim-correct
          config: {}
        results:
          delivered:
            criteria: |
              指定 PR 已以 merge commit 合入交接目标，源 head 与交接一致，合并前记录包含修订/时间/方式及必要检查保护证据；mergeCommit 第一父等于 approvedBase，远端目标包含交接 head/mergeCommit及本票实现提交，有可核验依据。本实施 Issue 交付评论已发布且本票关闭，未越权维护其他票。上游验证/延期边界已传递，工作区干净并位于指定milestone 分支，重入无重复副作用。只验本节点合并与收尾，不重判审查。
            target:
              return: delivered
    returns:
      - delivered
