# 多仓 Milestone：伞仓集中工单，全仓里程碑分支，固定受验 gitlink 后交付。
schemaVersion: agent-workflow/v3
actorCommonPersona: |
  本配置只用于伞仓及其全部受管子仓。GitHub Issue/Milestone 统一在伞仓 trackerRepo，代码 PR 在目标仓；各仓 feature→milestone→基线。gh 显式 --repo，git 显式 -C，跨仓对象用完整 URL 或 owner/repo#number。
  信任前序已验收的结果，直接消费 handoff，不重做上游审查或全流程巡检。只检查本节点操作所需的当前对象、修订和实际结果；已知输入矛盾/缺失交 Manager，不虚构成功。范围改变由 Manager 协调，不自行增加上游兜底步骤。
  保护用户内容；写操作串行，不强推、硬重置、绕过保护或自动清理。每次只暂存本任务文件；子仓切换造成的伞仓 gitlink 偏移是预期状态，不用全局清理消除。gitlink 只在集成准备时提交，固定为受验提交；发布不换成子仓最新 tip 或新 merge SHA。合并使用 merge commit，不支持则交 Manager。
  项目规范提供质量与权限，当前配置规定流程；未解决冲突 BLOCK。环境/部署由 Manager 按有效授权和实际可用技能协调；真实客户端/独立测试等项目门槛不因简化而省略。共享客户端按实例归属独占，不结束他人进程。
  结果评论绑定 runId、阶段、对象/修订和证据。普通报告直接写 Issue，PR 留摘要及链接并用 Implements 引用，避免提前自动关票；长报告才写 ignored、未跟踪 run 目录，Issue 留摘要/版本/路径。多行发布用 --body-file，不泄露凭据。重试只查询本节点已执行的操作，成功复用、遗漏补齐。
  实施票合入 milestone 只记录 code-integrated，所有票到最终收尾统一关闭。本轮实施依赖按前置 code-integrated 满足；外部依赖、明确验收依赖和人工 hold 按其条件处理。handoff 保留 runId、主 Issue/初始化计划链接、Milestone、仓库分支表、当前对象及本节点结果链接；完成清单、manifest、publication 产生后继续传其链接。
roles:
  coordinator:
    persona: |
      负责选票、合并、集成准备和收尾，不改产品实现。任务穷尽只在选票节点判断；其他节点信任该结果。集成准备固定 gitlink，发布只合并已审已测版本、先子仓后伞仓，收尾只关票。部分发布重试只补未完成仓，不回滚或重新发布已完成仓。
    model:
      provider: zai-coding-cn
      modelId: glm-5.3-flash
  planner:
    persona: |
      仅按集成审查/验证的具体必修发现拆分或复用修复 Issue，全部留伞仓；每张实施票一个目标仓，注明验收和实施依赖。保留已集成记录，修复已合并代码使用新分支/PR；不重新规划整项需求，不实现或合并。
    model:
      provider: kimi-coding
      modelId: k3-256k
  developer:
    persona: |
      只实现当前 Issue，在指定仓 feature 分支开发，按项目要求自测后开 feature→milestone PR。返工修复同一开放 PR；不合并、关票或更新伞仓 gitlink。
    reuse: continuable
    model:
      provider: commandcode
      modelId: deepseek/deepseek-v4.1-flash
  code-reviewer:
    persona: |
      独立审查当前 PR 或多仓集成候选；实现只读，不合并、不代独立测试。复用已验收结果，单票审实现，集成审跨仓交互及本阶段差异，不逐票重审。结论绑定确切 PR base/head 或 manifest。
    model:
      provider: kimi-coding
      modelId: k3
  tester:
    model:
      provider: kimi-coding
      modelId: k3
    persona: |
      按验收标准和指定版本独立设计并执行测试，不以开发自测结论代替独立验证。记录实际源码/制品/服务版本与结果，不改产品代码、合并或关票。必要环境缺失请 Manager 按授权准备，不自行部署，不把未执行写成通过。
judgeRole:
  persona: |
    只读核验当前命名结果的 criteria 和本节点证据；前序已通过的结果作为输入，不重新验收上游或追加历史流程门槛。事实支持 ACCEPT，明确不符 REJECT，必要信息不足 NEED_CONTEXT。核实当前动作的对象/修订/实际结果，评论作证据入口。code-integrated、published、最终 delivered 不混同；不因 Issue 尚未关闭否认实施完成，也不要求 gitlink 等于基线最新 tip。
  model:
    provider: zai-coding-cn
    modelId: glm-5.3-flash
  tools:
    deny:
      - edit
      - write
workflow:
  startNode: initialize-and-plan
  nodes:
    initialize-and-plan:
      execution:
        type: actor-task
        role: manager
        instruction: |
          1. 检查伞仓及全部受管子仓的工作树/索引干净，读取 .gitmodules、remote 与项目规范，确定唯一伞仓 trackerRepo。读取本次主 Issue；不存在则先与用户明确需求入口。检查现有子票是否足够实施，只对未细化部分使用实际可用 to-tickets 或项目等价拆票技能，不重复拆票。每张实施票一个目标仓，列验收、实施依赖及所需自测/independentPremerge；本轮实施依赖以合入 milestone 满足，外部/明确验收依赖及人工 hold 保留原义，计划不得形成等待最终关票的死锁。
          2. 询问或沿用用户明确的本次基线，推荐 Milestone 名和统一 milestone 分支名；展示所有仓的路径/远端/基线及起点，让用户一次确认。缺子仓基线时从伞仓所选基线记录的该仓 gitlink 创建；已有同名基线与 gitlink 不一致时展示差异并确认实际起点，不擅自移动已有基线。伞仓基线不存在时先明确其创建起点。
          3. 确认后补齐缺失基线，在伞仓创建/复用 GitHub Milestone；伞仓及全部子仓（含本轮不改代码的仓）从确认基线创建并推送 milestone 分支，将主/子 Issue 关联到唯一伞仓 Milestone。已有本次资源只复用，不重置分支。显式切换各仓分支并核对操作结果，不依赖 hook 管理临时分支，不修改 .gitmodules 的长期跟踪分支。
          4. 主 Issue 发布一份初始化计划：用户确认、仓库分支表/起点、实施清单/依赖/验收、测试及环境授权入口。普通进度写 Issue，长报告才放 ignored 未跟踪 run 目录。当前流程角色与步骤由配置规定，项目质量要求保留，已知冲突交用户解决。handoff 保留 runId、主 Issue/初始化计划链接、Milestone、仓库分支表、当前对象及本节点结果链接；完成清单、manifest、publication 产生后继续传其链接。记录配置版本 2026-09-19.2，完成后 ready；用户明确取消则 cancelled，不把未回复当取消。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        ready:
          criteria: |
            主 Issue 的初始化计划已发布；基线起点、Milestone/分支名及操作范围有用户确认；伞仓与全部子仓的基线、milestone 分支已准备并推送，切换操作未丢失用户内容。实施子票验收/目标仓/依赖明确并归入伞仓 Milestone，所需独立验证已标明，至少一票可执行，无依赖死锁；handoff 含计划和仓库分支表。
          target:
            node: run-issue-cycle
        cancelled:
          criteria: |
            有用户明确取消的依据；如实交代已创建资源，不伪称交付，不为取消创建额外资源。
          target:
            return: cancelled
    run-issue-cycle:
      execution:
        type: child-workflow
        workflowId: issue-cycle
      onReturn:
        code-complete:
          node: prepare-integration
    prepare-integration:
      execution:
        type: actor-task
        role: coordinator
        instruction: |
          1. 消费循环的 code-complete 和仓库分支表，不再查询 Issue 完成情况或重审实施。只准备各仓 milestone→基线 的集成候选；不存在该 PR 时创建，已有则复用。
          2. 逐子仓固定当前基线 base，将必要基线更新安全合入 milestone，冲突交 Manager 处理，不在此改产品逻辑。候选 head 包含 base；记录 head/tree，推送。无内容差异仓以固定基线 SHA/tree 作为 no-change 候选，不拿尚未被基线包含的空提交充数，也不制造空 PR。已产生本次最终合并的仓不能重建候选，交 Manager 处理已有发布。
          3. 伞仓 milestone 同步其基线后，仅提交本次各子仓候选 head 的 gitlink 及授权集成材料；先确保子仓提交已推送，再推伞仓。gitlink 固定为这些待验收提交，后续即使子仓产生新 merge SHA 也不替换。
          4. 主 Issue 发布 manifest：各仓路径、baseline/milestone、固定 base/head/tree、集成 PR 或 no-change、伞仓 gitlink、验收/环境入口及循环完成清单链接。候选是待审待测版本，不要求未来的测试结果。只将有变化的旧候选结论标为失效，交 final-review。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        integration-ready:
          criteria: |
            manifest 已发布；各仓候选已推送、包含固定基线且 PR 方向为 milestone→基线，无差异仓有 no-change 记录；伞仓候选 gitlink 精确对应子仓候选 SHA，未混入用户内容。已交接候选及循环完成清单，尚未声称集成验收通过。
          target:
            node: final-review
    final-review:
      execution:
        type: actor-task
        role: code-reviewer
        instruction: |
          审查 manifest 的多仓集成差异、跨仓接口及主需求覆盖，复用单票审查结果，不重新扫描实施清单或逐票重审。固定各 PR base/head 与 gitlink；有具体必修发现 changes-required 交修复规划，无必修 approved 交独立测试。候选修订改变则 stale-review 回集成准备；输入缺失 BLOCK。主 Issue 发布结论及 manifest 链接。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        approved:
          criteria: |
            本次集成审查结论已发布并绑定当前 manifest，各仓集成差异和跨仓交互无未解决必修项；候选修订未改变，独立集成测试仍待后继执行。
          target:
            node: verify-integration
        changes-required:
          criteria: |
            有具体、可执行的集成必修清单，注明目标仓、依据和验收；不把纯环境问题当产品缺陷。
          target:
            node: plan-remediation
        stale-review:
          criteria: |
            当前候选修订已改变，记录旧/新对象；本次最终发布尚未开始，需要重新准备候选。
          target:
            node: prepare-integration
    verify-integration:
      execution:
        type: actor-task
        role: tester
        instruction: |
          基于已批准 manifest 和验收标准独立执行集成测试，核对本次实际运行的源码/制品/服务版本。按项目要求进行真实客户端、部署就绪及全栈验证；纯文档执行适用检查，不假称 E2E。缺环境或部署能力 BLOCK，由 Manager 按授权准备指定版本，不能拿其他分支部署成功代替。主 Issue 记录用例、版本与结果；通过 passed，产品缺陷 changes-required，候选修订改变 stale-review。不重做代码审查，不合并关票。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        passed:
          criteria: |
            独立集成测试报告绑定当前 manifest 和实际运行版本，全部适用验收通过；必需真实环境/部署就绪有对应证据，候选未改变，无未解决失败或必需验证缺口。
          target:
            node: publish-integration
        changes-required:
          criteria: |
            指定版本的实际验证发现可复现产品缺陷，已记录受影响仓及修复验收，交规划修复。
          target:
            node: plan-remediation
        stale-review:
          criteria: |
            待验候选的修订发生变化，已记录对象差异；最终发布尚未开始，原测试不能覆盖新候选。
          target:
            node: prepare-integration
    publish-integration:
      execution:
        type: actor-task
        role: coordinator
        instruction: |
          1. 消费已批准且独立验收通过的 manifest，只做发布，不重新审查需求/代码/测试。先区分已完成与待发布仓；已合并 PR 只按原批准核验本次合并结果、补记遗漏，不把合并造成的基线前进当作漂移。紧邻每个待发布仓的操作核对当前 PR base/head 与受验版本及仓库保护；待确认 no-change 仓核对固定基线 SHA/tree。尚无任何最终合并时发现修订变化，stale-review 回准备；已有部分仓发布则保留事实 BLOCK 交 Manager，不将整个批次退回准备。
          2. 按依赖顺序先子仓后伞仓，将有差异仓的 milestone PR 以 merge commit 合回基线；无差异仓只核验登记版本已在基线。每仓合并后确认实际 tree 等于受验 head tree、源 head/基线匹配本次批准且基线包含受验提交，记录实际 merge SHA。伞仓 gitlink 始终保留受验子仓 head，不改成 merge SHA 或最新 tip。
          3. 每仓成功立即记主 Issue 发布进度；结果未知先查本次 PR，已合并的按原发布记录核验，重试只补未完成仓。实际合并内容不符或发布后新缺陷 BLOCK，不自动回滚。全部完成后汇总 publication：manifest、每仓受验 SHA→实际交付 SHA/tree、PR/no-change、伞仓指针及完成清单链接；published 交收尾，不关票。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        published:
          criteria: |
            全部仓的发布结果已记录为 publication：有差异 PR 已合回对应基线，实际 merge tree 与受验 tree 一致且基线包含受验提交；无差异仓已在基线。伞仓最后完成，gitlink 保持受验 SHA，子仓提交远端可达；无需等于子仓最新 tip 或实际 merge SHA。handoff 含 publication 与完成清单，无未完成发布，Issue 收尾尚待执行。
          target:
            node: close-milestone
        stale-review:
          criteria: |
            发布操作前发现候选 PR base/head 或待确认 no-change 基线 SHA/tree 与受验版本不一致，已记录差异；本次所有仓均尚未执行最终合并，无部分发布被隐藏。
          target:
            node: prepare-integration
    close-milestone:
      execution:
        type: actor-task
        role: coordinator
        instruction: |
          消费 publication 和循环完成清单，不重验上游实现/审查/测试，不再合并或更新 gitlink。按清单给子 Issue 记录交付链接并统一关闭，再关闭聚合父票、主 Issue 和 Milestone，按项目既有标签词义维护；部分关票失败只补未完成项。发布最终摘要，保留分支并安全恢复约定工作状态；子仓可保留在受验 milestone 分支，不强制检出基线最新 tip。新增范围或已知交付缺陷交 Manager，不擅自补入本次收尾。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        delivered:
          criteria: |
            清单内所有子票、父票/主票和 Milestone 已完成关闭，最终摘要链接 publication；工作区收尾完成且用户内容保留。没有在收尾阶段新增代码、变更指针或重复发布。
          target:
            return: delivered
    plan-remediation:
      execution:
        type: actor-task
        role: planner
        instruction: |
          只处理本轮集成审查/测试的具体必修发现，在伞仓创建或复用修复实施票并关联同一 Milestone。每票指定目标仓、验收和实施依赖，使用原 milestone 分支继续交付；保留已完成票的 code-integrated 记录。主 Issue 追加发现→修复票映射及计划变更，至少一票可执行，交回实施循环；外部环境缺口交 Manager，不造产品修复票。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        planned:
          criteria: |
            本轮必修发现已映射到伞仓修复票，目标仓/验收/实施依赖明确且归入本 Milestone，至少一票可执行；旧实施记录保留，修复计划已交接。
          target:
            node: run-issue-cycle
  returns:
    - delivered
    - cancelled
childWorkflows:
  issue-cycle:
    startNode: select-next-issue
    nodes:
      select-next-issue:
        execution:
          type: actor-task
          role: coordinator
          instruction: |
            1. 本节点独占任务选择与循环结束判断。按计划和 Milestone 完整分页检查实施票集合，消费已验收的 code-integrated 记录，不重新核验历史 PR 的代码/测试。已集成票虽 open 也不再领取；未纳入计划的对象交 Manager，不擅自扩范围。
            2. 选一张未集成且实施依赖已满足的票；本轮前置合入 milestone 即满足实施依赖，不等待关票，外部/明确验收依赖与人工 hold 仍按条件处理。有剩余工作但无可执行票则 BLOCK，不能声称完成。
            3. 从目标仓当前 milestone 建立/复用本票 feature 分支，领取评论记录目标仓、分支起点、验收及独立合并前验证要求；selected 交实现。不提交伞仓指针。
            4. 全部实施票均已有 code-integrated 时，在主 Issue 发布完成清单和证据索引，列待最终统一关闭的主/子票，code-complete 返回集成准备。这里只判断代码完成，不构建集成候选。
        checker:
          checkerId: judge.claim-correct
          config: {}
        results:
          selected:
            criteria: |
              已选出本次计划内尚未集成、依赖满足且无人工阻塞的实施票；目标仓 feature 从 milestone 建立并记录起点，领取入口和验收已交接。
            target:
              node: deliver-one-issue
          code-complete:
            criteria: |
              本轮非空实施集合全部已有已验收的 code-integrated，无遗漏的计划内实施票；完成清单/待关票索引已发布并交接。Issue 保持开放，不代表实施未完成。
            target:
              return: code-complete
      deliver-one-issue:
        execution:
          type: child-workflow
          workflowId: issue-delivery
        onReturn:
          code-integrated:
            node: select-next-issue
    returns:
      - code-complete
  issue-delivery:
    startNode: implement
    nodes:
      implement:
        execution:
          type: actor-task
          role: developer
          instruction: |
            按当前票验收和返工发现实现，仅修改指定仓 feature 分支。同步必要 milestone 更新，执行项目要求的开发检查/自测；要求真实客户端自检时通过后才开 PR。提交推送 feature→milestone PR，在伞仓 Issue 记录实现、自测结果、PR base/head 及版本；返工复用原开放 PR，已合并修复使用新 PR。不合并、关票或更新 gitlink。
        checker:
          checkerId: judge.claim-correct
          config: {}
        results:
          implemented:
            criteria: |
              当前票实现及返工已交付为目标仓 feature→milestone PR，head 包含当前 milestone 基线，所需开发自测已执行并记录真实结果；Issue 有实现/PR 修订与证据链接，未提前合并关票。
            target:
              node: review
      review:
        execution:
          type: actor-task
          role: code-reviewer
          instruction: |
            审查当前 PR 的实现与本票验收，核对自测证据及本轮修改，不复查初始化/拆票。结论绑定当前 base/head；必修或必要基线同步 changes-required 回实现。无必修时，计划要求独立合并前验证则 verification-required，否则 approved。Issue 发布结论；给 tester 只传验收/源码版本/环境入口，不传开发自测结论。
        checker:
          checkerId: judge.claim-correct
          config: {}
        results:
          approved:
            criteria: |
              本票当前 base/head 审查通过，无未解决必修，开发检查充分，计划未要求独立合并前验证；结论已发布。
            target:
              node: complete-issue
          verification-required:
            criteria: |
              本票当前 base/head 代码审查通过，按计划尚需独立合并前验证；已交接验收、版本和环境入口。
            target:
              node: verify-issue
          changes-required:
            criteria: |
              本轮有具体实现缺陷或必要基线同步要求，Issue 已记录可执行修复及验收清单。
            target:
              node: implement
      verify-issue:
        execution:
          type: actor-task
          role: tester
          instruction: |
            按本票验收独立执行计划要求的合并前测试，绑定当前 PR base/head，记录实际用例/版本/结果。全部通过 passed；产品缺陷 changes-required 回实现；PR 修订变化 stale-review 回审查。必要环境缺口交 Manager，不重新做代码审查或重复开发自测报告。
        checker:
          checkerId: judge.claim-correct
          config: {}
        results:
          passed:
            criteria: |
              本票所需独立合并前验证已实际通过，报告绑定当前 PR base/head，无必需验证缺口。
            target:
              node: complete-issue
          changes-required:
            criteria: |
              实际验证发现本票产品缺陷，记录版本、复现和修复验收。
            target:
              node: implement
          stale-review:
            criteria: |
              待合并 PR 修订发生变化，当前验证不能覆盖新修订，已交接差异。
            target:
              node: review
      complete-issue:
        execution:
          type: actor-task
          role: coordinator
          instruction: |
            消费本票批准及所需独立验证，只负责 feature→milestone 合并。紧邻操作核对 PR base/head 与批准一致、满足仓库保护，记录合并前核验后用 head 条件保护 merge commit；变化则 stale-review 回审查。合并后确认源 head、实际 tree 与批准相符且 milestone 包含实现，Issue 记录 code-integrated/merge SHA，保持 open。结果未知先查本 PR，重试只补遗漏。安全切回目标仓 milestone，伞仓预期指针偏移不提交；交回循环，不扫描其他票。
        checker:
          checkerId: judge.claim-correct
          config: {}
        results:
          code-integrated:
            criteria: |
              本票 PR 已按批准版本合入目标仓 milestone，实际合并结果与批准相符，Issue 已记录 code-integrated 且保持开放；当前操作与工作区状态已交接。
            target:
              return: code-integrated
          stale-review:
            criteria: |
              PR 尚未合并，当前 base/head 或新实质反证使本票批准失效，差异已交接；未提前关票。
            target:
              node: review
    returns:
      - code-integrated
