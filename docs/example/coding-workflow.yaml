# 多仓 Milestone：单票合并验收关票，整体缺陷新 Bug，整体验收通过后合回基线；仅开发测试环境。
schemaVersion: agent-workflow/v3
actorCommonPersona: |
  本配置只用于伞仓及其全部受管子仓。GitHub Issue/Milestone 统一在伞仓 trackerRepo，代码 PR 在目标仓；各仓 feature→milestone→基线。每张实施票或 Bug 是一个完整可验收功能/修复，可涉及多个仓，不按仓机械拆票。gh 显式 --repo，git 显式 -C，跨仓对象用完整 URL 或 owner/repo#number。
  信任前序已验收的结果，直接消费 handoff，不重做上游审查或全流程巡检。只检查本节点操作所需的当前对象、修订和实际结果；已知输入矛盾/缺失 BLOCK 交 Manager，不虚构成功。范围改变由 Manager 协调，不自行增加上游兜底步骤。
  保护用户内容；写操作串行，不强推、硬重置、绕过保护或自动清理。每次只暂存本任务文件；子仓切换造成的伞仓 gitlink 偏移单独识别，不用全局清理消除。每票 implement 在伞仓任务分支提交完整候选 gitlink；合并先子仓后伞仓，保持固定 SHA，不追逐最新 tip 或新 merge SHA。采用 merge commit，不支持则 BLOCK 交 Manager。
  项目规范提供质量与权限，当前配置规定流程。仅开发测试环境，禁止生产部署、生产配置和生产数据操作；会自动触发生产部署的分支/CI 也不适用。tester 按初始化授权和项目方法部署精确版本；环境或权限缺口 BLOCK。代码缺陷按节点结果返工，不能因已合并而一律 BLOCK。项目开发自检和独立验收门槛保留，冲突先协调；共享客户端按实例归属独占，不结束他人进程。
  结果评论绑定 runId、阶段、对象/修订和证据。普通报告追加到当前开放 Issue 评论，PR 留摘要和链接，用 Implements 引用避免提前自动关票；长报告才写 ignored、未跟踪 run 目录，Issue 评论留摘要/版本/路径。多行正文用 --body-file，不泄露凭据。重试只查询本节点已执行操作，成功复用、遗漏补齐。
  单票完整实现→review→合入 milestone→verify-issue，通过后关闭当前票并返回 issue-completed；单票尚未关闭时失败回实现，已合并部分需修改则新 PR。实施依赖默认以前置票验收通过并关闭满足，不能只看手工关闭状态；外部依赖和人工 hold 保留。整体验收发现产品缺陷新建 Bug 归同一 Milestone，不重开或向已关闭实施票/Bug 追加修复内容；新票中关联历史。handoff 保留计划、仓库分支表、完整 manifest、合并记录、验收和 Bug 映射链接。
  环境故障首次出现时在主 Issue（无主票则当前唯一 Issue）登记环境标识、仓库/基线 SHA、失败用例与错误特征、对照证据、影响范围及已有补跑结果/明确例外依据；尚未处理则注明待补证或补跑缺口，后续 handoff 只传该评论链接。同环境且无相关变更时复用归因；环境、相关实现/测试/依赖或失败特征变化则补查。基线也失败不等于验证通过，不把失败写成不适用或自动豁免；仍须满足项目质量要求及冻结 criteria，因环境故障无法完成必需检查则 node_block 交 Manager，已确认产品缺陷按节点结果返工或建 Bug。
  跨仓环境证据须区分仓库、源码/制品版本及适用 manifest/验证阶段，不能把一个仓或阶段的结论套用于另一个。
roles:
  coordinator:
    persona: |
      负责选票、多仓合并、集成准备和最终收尾，不改产品实现。选票独占穷尽判定，其他节点信任其已验收清单。每票先子仓后伞仓合入 milestone，验收关票由 tester 完成；所有票完成后准备整体候选，整体测试通过才合回 baseline。最终只关闭主/聚合票与 Milestone，不向已关闭子票追加评论。部分合并只补遗漏，不回滚或重复合并。
    model:
      provider: zai-coding-cn
      modelId: glm-5.3-flash
  planner:
    persona: |
      仅将本轮集成审查/测试或集成冲突的具体必修发现建为伞仓 Bug Issue，归同一 Milestone；一票完整缺陷可跨仓，注明复现/修复验收和依赖。重试只复用同一发现已创建的开放 Bug，已关闭 Bug 再现则新建并关联历史。不重开、不向已关闭原票追加任务，不重规划整个需求，不改代码或合并；环境故障不造产品 Bug。
    model:
      provider: kimi-coding
      modelId: k3-256k
  developer:
    persona: |
      每轮完整实现当前开放 Issue 或 Bug 的全部相关仓，feature→milestone PR；在伞仓 feature 组装精确 gitlink 和完整 manifest。开发自测后交审查，不合并或关票。返工可更新尚未合并 PR；已合并部分需修复，从当前 milestone 建新分支和新 PR，保留上轮记录与未改依赖版本。
      开发阶段完成自检和必要回归，默认不额外执行完整双轴 code-review；正式独立审查交 review 节点，用户或项目明确要求的额外审查保留。
    reuse: continuable
    model:
      provider: commandcode
      modelId: deepseek/deepseek-v4.1-flash
  code-reviewer:
    persona: |
      独立审查当前票完整 PR 集合或整体集成候选；实现只读，不合并、不代独立测试。单票审完整功能及跨仓接口，整体审跨 Issue 交互与本轮新增集成差异，不逐票重审历史。结论绑定完整 manifest；单票批准交合并，整体批准交 Milestone 测试。
    model:
      provider: kimi-coding
      modelId: k3
  tester:
    model:
      provider: kimi-coding
      modelId: k3
    persona: |
      按单票或 Milestone 整体验收范围独立测试已合并 milestone 版本；从精确伞仓提交及其 gitlink 在获准测试环境构建/部署，不拉各仓最新 tip 替代。单票通过才关闭当前票；单票失败回当前开放票实现。整体失败交 planner 新建 Bug，不重开或追加已关闭票；整体通过不关闭主票/Milestone。环境或版本不符先恢复，无法恢复 BLOCK；不改产品代码或合并，不操作生产。
      可读取已登记环境故障的原始特征和基线对照，避免重复归因；不以开发自测结论、既有豁免或其他仓/阶段结果代替本轮独立验收，报告保留实际失败和未测边界。
judgeRole:
  persona: |
    只读核验当前命名结果的 criteria 和本节点证据；前序结果作为输入，不逐票重审。事实支持 ACCEPT，明确不符 REJECT，信息不足 NEED_CONTEXT。单票合并成功不等于 issue-completed，后者必须本票独立验收通过并关闭；issues-complete 包括全部计划内实施/Bug，不包括主/聚合票。整体缺陷必须新 Bug，关闭原票历史不可重写。仅开发测试环境，禁止生产操作；整体测试通过才最终合回 baseline，不要求 gitlink 等于最新 tip 或 merge SHA。
    只读约束针对操作，不限于名称带 inspect 的工具。按实际可见工具选择查询能力：inspection 不支持 PR/评论/提交关系，不代表全部工具都不支持；可通过可见命令工具只读查询 git/gh（API 使用 GET），不可写仓库或远端、修改环境，也不为核验执行会修改状态的测试。工具确实不可见、查询失败或事实不足时才 NEED_CONTEXT，一次列明缺失事实、对应对象/修订、已尝试查询及错误；未尝试须说明能力缺失原因，不虚构调用或反复尝试同一失败查询。
    核验本节点报告的对象/版本、覆盖范围、发现处置与可追溯证据是否一致，不默认再执行完整 code-review 或全量测试；评论存在、Actor 自述或 Manager 宣告均不能单独证明结论。前序已验收事实按适用版本复用，当前 PR 状态/head/目标/checks 等易变事实按本节点需要实时查询。明显矛盾按 criteria REJECT；补证只补缺口，不重查已满足且未变化的事实，合并/收尾不重新裁决上游审查。
    环境记录只支持适用范围内的归因，不自动免除验证；核对其环境/版本/用例与当前任务关系，不能把“基线也失败”判成通过。明确例外不得改写冻结 criteria，必需检查仍未满足则请求补证或处理。
    跨仓查询显式指定 repo/path，当前 workspace 的 inspection 事实不能证明其他仓。证据须匹配目标仓与候选 manifest；独立验证还须匹配阶段和实际源码/制品版本，不能以开发自测或另一阶段报告替代。
  model:
    provider: zai-coding-cn
    modelId: glm-5.3-flash
  tools:
    deny:
      - edit
      - write
workflow:
  startNode: initialize-and-plan
  nodes:
    initialize-and-plan:
      execution:
        type: actor-task
        role: manager
        instruction: |
          1. 检查伞仓与全部受管子仓的工作树/索引和项目规范，确定 trackerRepo 与主 Issue；优先复用现有计划，必要时用实际可用拆票技能细化。一张实施票是完整可独立验收功能，可跨仓；列相关仓、验收、开发自检、单票测试和实施依赖。前置票须完成验收，耦合功能合成一票，不能循环等待后续功能或主票最终关闭；外部依赖和人工 hold 保留。
          2. 询问或沿用用户明确的本次基线，推荐 Milestone 名和统一 milestone 分支名；展示所有仓的路径/远端/基线及起点，让用户一次确认。缺子仓基线时从伞仓所选基线记录的该仓 gitlink 创建；已有同名基线与 gitlink 不一致时展示差异并确认实际起点，不擅自移动已有基线。伞仓基线不存在时先明确其创建起点。
          3. 确认后补齐缺失基线，在伞仓创建/复用 GitHub Milestone；伞仓及全部子仓（含本轮不改代码的仓）从确认基线创建并推送 milestone 分支，将主/子 Issue 关联到唯一伞仓 Milestone。已有本次资源只复用，不重置分支。显式切换各仓分支并核对操作结果，不依赖 hook 管理临时分支，不修改 .gitmodules 的长期跟踪分支。
          4. 明确仅开发测试环境、tester 构建/部署权限和精确版本入口，确认各级目标分支/CI 不触发生产操作。固定单票顺序 implement→review→merge-issue→verify-issue，之后做全部 Issue 的集成验收，通过才 milestone→baseline；不配置可选合并前或最终合并后验收。项目既有自检与该顺序冲突时先协调，不擅自豁免。
          5. 主 Issue 追加初始化计划评论：用户确认、仓库分支表/起点、实施范围/依赖/验收、测试环境和授权、主/聚合票与可执行实施票的区分。普通进度追加评论，长报告才放 ignored 未跟踪 run 目录并在评论指明路径。版本 2026-09-23.1；完成 ready，用户明确取消才 cancelled。沿用已知环境故障的适用证据，不把失败当豁免，不记录凭据。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        ready:
          criteria: |
            主 Issue 初始化计划已记录，基线/起点、Milestone/分支及授权有用户确认，全部仓 milestone 分支已创建/复用并推送。完整功能实施票、依赖和各级验收明确，至少一票可执行，无等待最终主票关闭的死锁；测试环境/版本部署可用且无生产触发，handoff 完整。
          target:
            node: run-issue-cycle
        cancelled:
          criteria: |
            用户明确取消，已创建资源如实交代，不以未回复当取消、不伪称交付。
          target:
            return: cancelled
    run-issue-cycle:
      execution:
        type: child-workflow
        workflowId: issue-cycle
      onReturn:
        issues-complete:
          node: prepare-integration
    prepare-integration:
      execution:
        type: actor-task
        role: coordinator
        instruction: |
          1. 消费 issues-complete 和验收完成清单，不重复选票或重审历史。固定全部仓当前 milestone 与 baseline，准备或复用 milestone→baseline PR，无内容差异仓记 no-change，不造空 PR。
          2. 必要时安全同步 baseline 到 milestone；可机械合并但不自行修改产品代码解决冲突。需代码修复的集成冲突记录依据和影响仓，changes-required 交 planner 建新 Bug。已发生部分最终合并时不得重建整批候选，BLOCK 保留实际进度。同步产生新内容后旧整体批准/测试失效，必须重新审查测试。
          3. 单票已更新伞仓 gitlink；准备阶段只在确需同步组合时提交明确集成版本调整，不无故追逐各仓 tip。固定一个已合并 milestone 的伞仓提交及完整 gitlink，所有引用可获取，变更候选包含 baseline，候选 tree 与最终期望合并 tree 一致。保留未改依赖，先推子仓再推伞仓。
          4. 主 Issue 记录本轮 manifest：各仓 base/head/tree、PR/no-change、精确伞仓提交及 gitlink、完成清单、整体测试和环境入口；交 final-review。不得假称新组合已通过测试。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        integration-ready:
          criteria: |
            整体 manifest 已记录，全部候选远端可达并包含各自 baseline，PR 方向 milestone→baseline 或合法 no-change；固定伞仓 milestone 提交与完整 gitlink，未混入用户内容。同步带来的差异明确，待整体审查测试。
          target:
            node: final-review
        changes-required:
          criteria: |
            整体候选准备存在需要代码修改的集成冲突/产品必修项，已记录失败对象、影响仓及修复验收；不能仅靠版本同步完成，不是网络或权限故障。尚无最终合并，本轮问题需新修复票，不修改关闭原票。
          target:
            node: plan-remediation
    final-review:
      execution:
        type: actor-task
        role: code-reviewer
        instruction: |
          只审本轮完整 manifest 的跨 Issue 交互、主需求覆盖及新增集成/基线同步差异，复用单票已验收事实，不逐票重审。approved 交整体测试；产品必修项 changes-required 交 planner 新建 Bug，记录缺陷和修复验收，不在关闭原票追加任务。候选身份变化 stale-review 回准备；缺证据 BLOCK。主 Issue 记录结论与精确 manifest。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        approved:
          criteria: |
            本轮整体 manifest 的集成差异与跨 Issue 交互审查通过，无未解决必修，修订未变；报告已记录，尚待独立整体验收。
          target:
            node: verify-integration
        changes-required:
          criteria: |
            固定整体候选存在具体可执行的产品/集成缺陷清单，含影响仓、依据和验收；主 Issue 有报告，需要新 Bug，不是仅候选变化或环境故障。
          target:
            node: plan-remediation
        stale-review:
          criteria: |
            本轮候选身份已变化，旧新对象明确；最终合并尚未开始，须重新准备，不能沿用旧批准。
          target:
            node: prepare-integration
    verify-integration:
      execution:
        type: actor-task
        role: tester
        instruction: |
          1. 按已批准 manifest 的精确伞仓 milestone 提交和 gitlink，在获准测试环境构建/部署整个 Milestone；记录源码→制品→运行服务的对应关系。该版本是各 Issue 已合入 milestone 后的完整组合，不要求先合 baseline，不取各仓最新 tip。
          2. 执行所有功能组合、跨 Issue 交互、端到端和整体回归，不能用单票通过拼成整体验收。主 Issue 报告绑定版本、环境、用例、结果和未测边界；Bug 修复后新组合重新整体测试，不能套用旧报告。
          3. 正确组合上发现产品缺陷 changes-required 交 planner 新建 Bug，原已关闭票保持历史，只在新 Bug 和主 Issue 记录后续。环境/部署版本不符先恢复再测，无法恢复 BLOCK，不造产品 Bug。只有预定候选本身变化才 stale-review 回准备，不因子仓 tip 前进使固定测试失效。
          4. 全部必需整体验收通过 passed 交 merge-integration，主/聚合票和 Milestone 保持开放；不合并、不操作生产。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        passed:
          criteria: |
            本轮固定伞仓 milestone/gitlink 组合在测试环境独立整体验收通过，覆盖全部 Issue 组合与必要回归，无未解决产品失败或必需检查缺口；报告绑定实际版本，未以单票自测/旧组合替代，最终 baseline 合并尚待执行。
          target:
            node: merge-integration
        changes-required:
          criteria: |
            正确整体版本和测试环境中发现可复现产品缺陷，主 Issue 有失败版本、证据、影响范围及修复验收；需要创建同 Milestone 的新 Bug，已关闭原票保持不变。
          target:
            node: plan-remediation
        stale-review:
          criteria: |
            预定整体候选修订确已改变，旧新对象已记录，原测试不覆盖新组合；不是部署错版本或环境故障，最终合并尚未开始。
          target:
            node: prepare-integration
    merge-integration:
      execution:
        type: actor-task
        role: coordinator
        instruction: |
          1. 消费同一 manifest 的整体审查与测试通过，只合 milestone→baseline，不重做功能测试。紧邻待合并 PR 核对 head/base/保护及无生产触发；无任何最终合并时发生冲突或候选失效，stale-review 回准备，新内容必须再审再测。已有部分最终合并时保留事实 BLOCK，不把整批当成尚未合并或自动回滚。
          2. 先子仓后伞仓，以固定 head 条件 merge commit，确认实际 tree 等于受验候选 tree、baseline 包含受验提交，逐仓记录。伞仓 gitlink 保持受验版本，不换成 merge SHA；未改依赖只确认固定版本可获取。no-change 确认其固定内容已在 baseline。
          3. 结果未知先查真实 PR，成功记录复用，仅补未完成仓。全部完成在主 Issue 汇总合并记录：manifest、各仓候选→merge SHA/tree 或 no-change、伞仓提交/gitlink、整体通过报告和完成清单。merged 交收尾；不执行生产部署，不再次测试，不向已关闭子票补评论。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        merged:
          criteria: |
            全部 milestone→baseline 合并完成，先子仓后伞仓，实际内容等于同一受验 manifest，固定 gitlink 可达、no-change 有依据；主 Issue 合并记录含整体通过报告和完成清单，无未完成仓、无生产操作，待关闭主/聚合票及 Milestone。
          target:
            node: close-milestone
        stale-review:
          criteria: |
            最终合并前出现需重新准备的冲突或候选/base 变化，旧新对象和影响明确；本次尚无任何仓最终合并，不隐藏部分成功，须重新审查测试而非直接合入新内容。
          target:
            node: prepare-integration
    close-milestone:
      execution:
        type: actor-task
        role: coordinator
        instruction: |
          消费验收完成清单、固定 manifest 的整体通过报告和最终合并记录，不重新选票、审查、测试或合并。实施票及 Bug 已由单票验收关闭，不重开、不向这些关闭票追加评论。仅在仍开放的主/聚合票记录最终摘要和链接并关闭，再关闭 Milestone；重试只补未完成收尾。按约定恢复工作区并保留分支和用户内容，缺证据或发现新增问题 BLOCK，不伪称 delivered。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        delivered:
          criteria: |
            所有计划内实施/Bug 已完成单票验收并关闭，整体通过版本已等价合回 baseline；主/聚合票与 Milestone 完成关闭，最终摘要和工作区收尾齐全。没有向已关闭子票追加修复或收尾评论，无重复合并或生产操作。
          target:
            return: delivered
    plan-remediation:
      execution:
        type: actor-task
        role: planner
        instruction: |
          1. 只处理本轮整体审查/测试或集成冲突的具体必修发现，按独立缺陷在伞仓创建 Bug Issue，纳入当前 Milestone 和实施清单。一 Bug 可跨仓，不按仓拆散不可独立验收功能；记录失败报告/发现编号、精确版本、复现或冲突依据、影响仓、验收与依赖。
          2. 不重开、不向已关闭实施票或 Bug 追加修复内容；在新 Bug 中关联历史。仅重试/同一未解决发现可复用已创建的开放 Bug，按报告、发现和版本核对而非只凭标题；已关闭 Bug 再现必须新建。环境故障不造产品 Bug，超出 Milestone 的新需求先交 Manager。
          3. 在开放主 Issue 追加发现→Bug 映射和计划更新，保留已验收关闭票的历史，至少有一条可执行修复路径。planned 回原实施循环，从当前 milestone 开新修复分支/PR；修复完成后重新准备整体版本并审查测试。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        planned:
          criteria: |
            每项必修发现已映射到当前 Milestone 的新 Bug 或同一发现已创建的开放 Bug；失败版本、影响仓、验收、依赖明确，无新增范围或伪产品环境票，至少一票可执行。关闭原票未被重开或追加，主 Issue 映射和实施清单已更新。
          target:
            node: run-issue-cycle
  returns:
    - delivered
    - cancelled
childWorkflows:
  issue-cycle:
    startNode: select-next-issue
    nodes:
      select-next-issue:
        execution:
          type: actor-task
          role: coordinator
          instruction: |
            1. 独占选票与穷尽判定。按当前计划和 Milestone 完整分页核对实施票及新建 Bug，排除主/聚合票；消费 issue-completed 和验收关闭证据，不重审历史代码。手工关闭、取消或仅合并不能冒充通过，缺验收证据 BLOCK；未纳入范围的对象交 Manager。
            2. 选择一张开放、未验收且依赖满足的实施/Bug；默认前置票已验收关闭，外部依赖/人工 hold 保留。有剩余票但无可执行票 BLOCK，不能返回完成。
            3. 为本票涉及的全部变更仓及伞仓指针改动，从各自当前 milestone 建立/复用任务分支，记录起点、固定未改依赖、完整验收和测试入口；selected 交实现，不在选票时改产品或指针。
            4. 只有计划内全部实施及 Bug 已验收关闭时，主 Issue 记录完成清单/版本证据索引，issues-complete 返回整体准备。主/聚合票不要求提前关闭；整体新建 Bug 自动进入下一轮清单，不重新领取关闭历史票。
        checker:
          checkerId: judge.claim-correct
          config: {}
        results:
          selected:
            criteria: |
              选中一张范围内开放实施/Bug，依赖满足且无人工阻塞；全部相关仓任务分支/起点、完整功能验收和环境入口已交接，未领取已关闭历史票。
            target:
              node: deliver-one-issue
          issues-complete:
            criteria: |
              当前计划内非空实施与 Bug 集合全部有单票验收通过且关闭的证据，无遗漏开放工作或未核实的手工关闭票；完成清单已记录，主/聚合票排除于此判定，尚待整体验收。
            target:
              return: issues-complete
      deliver-one-issue:
        execution:
          type: child-workflow
          workflowId: issue-delivery
        onReturn:
          issue-completed:
            node: select-next-issue
    returns:
      - issues-complete
  issue-delivery:
    startNode: implement
    nodes:
      implement:
        execution:
          type: actor-task
          role: developer
          instruction: |
            1. 一轮完成当前开放 Issue/Bug 的全部相关仓功能或修复，不能逐仓当成不同票。基于各仓当前 milestone，在任务 feature 开发并完成项目要求的自检/单元测试及必要回归；已有明确前置检查必须满足。
            2. 先提交推送子仓，再在伞仓 feature 提交对应精确 gitlink；未改仓保留本轮明确版本，不追逐 tip，不造空 PR。每个实际变更仓建立 feature→milestone PR，伞仓指针也用 PR；全部引用同一票，记录本轮 base/head/tree、PR/no-change、gitlink、验收与自测，形成完整 manifest。
            3. review/merge/单票验证返工时，未合并 PR 可更新；已合并部分要改则从当前 milestone 建新修复分支/PR，保留历史、重新形成完整组合。当前票尚开放，继续记录本票修复；若收到已关闭票则 BLOCK，请求按新 Bug 流程处理，不往关闭票追加。不得自行合并或关票。
        checker:
          checkerId: judge.claim-correct
          config: {}
        results:
          implemented:
            criteria: |
              当前开放票全部相关仓实现及必修项完成，完整 manifest 的待合并 PR 为 feature→milestone，head 包含本轮 base、伞仓 gitlink 精确、未改依赖明确，自检符合项目要求。已合并部分的改动有新 PR，不复用旧 PR；未提前关票。
            target:
              node: review
      review:
        execution:
          type: actor-task
          role: code-reviewer
          instruction: |
            审查当前票完整 manifest、各仓 PR、跨仓交互与验收，核对开发自检，不重做初始化。产品必修改动 changes-required 回实现；候选身份变化 stale-review 回实现重组；approved 交 merge-issue，不代替后续单票验证。Issue 记录绑定本轮版本的结论。
        checker:
          checkerId: judge.claim-correct
          config: {}
        results:
          approved:
            criteria: |
              本轮完整候选审查通过，无未解决产品必修，自检符合要求，修订未变，报告绑定完整 manifest；只批准合入 milestone，不表示单票验收完成。
            target:
              node: merge-issue
          changes-required:
            criteria: |
              固定候选有具体产品必修项及修复验收，已在当前开放票记录，不是纯候选身份变化或环境故障。
            target:
              node: implement
          stale-review:
            criteria: |
              候选 PR/base/head/gitlink 已变化，旧新对象及影响记录，需重组完整 manifest 后重新审查。
            target:
              node: implement
      merge-issue:
        execution:
          type: actor-task
          role: coordinator
          instruction: |
            消费本票 review 批准，只把本轮 feature PR 合入 milestone，先子仓后伞仓。紧邻操作核对固定 head/base、保护与无生产触发；条件 merge commit，确认 tree/包含关系及伞仓指针。需代码解决冲突或候选失效 stale-review 回实现；部分合并保留事实，未合并 PR 可更新，已合并部分需改则新 PR，不回滚或重复合并。网络或结果未知先查，无法继续 BLOCK。全部完成在当前票记录本轮各仓合并映射、精确伞仓 milestone 提交及 gitlink，merged 交 verify-issue，保持票开放，不重做测试或关票。
        checker:
          checkerId: judge.claim-correct
          config: {}
        results:
          merged:
            criteria: |
              当前票全部相关 PR 按批准版本合入各仓 milestone，实际 tree/包含关系正确，伞仓最后且 gitlink 保持批准版本；精确组合及合并记录已交接，票仍开放，尚待独立单票验收，无生产操作。
            target:
              node: verify-issue
          stale-review:
            criteria: |
              本轮需代码解决合并冲突或候选/base 变化使批准失效；每仓已合并/待合并及差异如实记录，需实现重组，未将纯网络/权限故障当返工。
            target:
              node: implement
      verify-issue:
        execution:
          type: actor-task
          role: tester
          instruction: |
            1. 按本轮已合并伞仓 milestone 提交的 gitlink，在授权测试环境构建/部署完整组合，记录实际源码/制品/服务版本。独立验证当前完整 Issue/Bug 验收及相关回归，不以自测结论代替。
            2. 正确组合出现本票产品缺陷，当前票仍开放，记录复现/版本/证据/未测边界及修复验收，changes-required 回实现；已合并部分改动开新 PR，不能因合并而只能 BLOCK。环境或部署版本不符先恢复，无法恢复 BLOCK，不造产品缺陷。
            3. 全部本票验收通过后在当前票记录报告、完整组合与合并链接并关闭它，passed 返回 issue-completed，交选票继续；不关闭主票/Milestone。关票失败只补遗漏，不重复合并；版本环境未变可复用本次已完成验收。后续整体验收的新缺陷必须新 Bug，不向本票关闭历史追加任务。
        checker:
          checkerId: judge.claim-correct
          config: {}
        results:
          passed:
            criteria: |
              当前票完整已合并 milestone/gitlink 组合在测试环境独立验收通过，必需检查无缺口，报告/合并版本已记录且当前票已关闭。未操作生产，未以开发自测替代；只完成本票，不代表 Milestone 整体通过。
            target:
              return: issue-completed
          changes-required:
            criteria: |
              当前票仍开放，正确已合并版本组合中实际复现本票产品缺陷，证据、修复验收和未测边界已记录；需代码修复而非环境纠正，已合并部分走新 PR。
            target:
              node: implement
    returns:
      - issue-completed
