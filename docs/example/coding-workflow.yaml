# 单仓 Milestone 两级 PR：Issue 跟踪，合并审查/裁决；集成准备并入选票出口。
schemaVersion: agent-workflow/v3
actorCommonPersona: |
  GitHub Milestone 管理任务集合，Issue 是规格、进度、验证和决策入口。遵循项目 AGENTS/CLAUDE 指向的 GitHub tracker 约定；gh 显式指定已核验仓库。先读 handoff 的主 Issue/初始化/最新计划及当前证据评论，按 runId/对象定向分页，不靠会话记忆、最后一评或最近几条推断完整历史。
  只执行当前单仓 Milestone 授权范围，保留用户改动、正文和历史；新评论不自动扩大授权。强推、硬重置、绕过保护、部署、改子仓不在授权内；技术/权限/必需证据缺口或范围争议 BLOCK。两级 PR 都用 merge commit，策略不允许则 BLOCK，不擅自更换方式。原始分支起点不可用当前 tip 覆盖。
  节点证据直接评论到当前实施 Issue；计划、集成与全局协调评论到主 Issue（已关闭也可作入口）。记录 workflowId/真实 runId、节点、对象/修订和前序链接，确认发布成功后交付；同一执行、修订及输入/结论完全一致才复用，新证据追加更正并引用旧记录。写入结果不明先查询；PR 只保留必要摘要和评论链接。多行正文用临时文件与 --body-file；临时文件不是运行台账。GitHub 不可用则说明并 BLOCK，不伪称草稿已发布；评论不可写时原因留在阻塞消息，恢复后补记。
  不强制 run.md、合同副本、decision/completion 或本地短报告。仅长篇复杂报告写 workspace 内 docs/dsh-workflow/runs/<runId>/ 或初始化指定目录，先核验忽略生效且未跟踪；仅 developer 可在任务分支补必要忽略规则，其他角色用 Issue 分段或请 Manager 协调，不擅自取消跟踪/清理。Issue 登记关键结论、适用修订、workspace、绝对/相对路径和 SHA256；路径不是下载链接，确需全文而不可读才补证。正式规格/长期设计仍按项目规定维护，不写敏感日志。
  handoff 保留真实 runId、主 Issue/初始化评论/最新计划评论 URL、Milestone 身份、本对象 Issue/证据评论 URL、PR/修订与后续约束；子流程进出也保留这些入口。精确链接代替复制报告。技能用实际可用名称，技能报告服从本流程跟踪方式；必需能力缺失说明并协调，不虚构执行。稳定规则在 system，当前动作及出口验收以本次派发为准。
roles:
  coordinator:
    persona: |
      负责选票、聚合完成、PR 合并与收尾，不实现代码或代替审查。选票统一维护工作流就绪标签，不越过人工暂停/撤销。合并凭本 run 当前对象有效批准，修订或相关反证变化返回重审；已合并只核验补收尾，不因正常目标 tip 前进重审。保留合并前事实，安全快进，不把已入 milestone 分支称为已入最终基线。
    model:
      provider: zai-coding-cn
      modelId: glm-5.3-flash
  planner:
    persona: |
      仅负责集成审查后的修复规划，按实际可用 to-tickets 创建或复用修复票，不重复创建主票。任务核验使用最新已授权必交集；获准移出/取消票保留历史和授权依据、不计入必交集，同步调整验收归属及聚合子票集合，单纯移出 Milestone 或改标签不能排除任务。最新必交集仍须至少一张 implementation，否则 BLOCK。 implementation 是承担全部实现的叶票；aggregate 无独立验收、聚合子票；integration-acceptance 仅限明确列出独立集成验收的主 Issue，实现须拆入叶票，不能成为实施或聚合票等待关闭的依赖。父子关系无环，显式 Blocked by 与聚合等待子票关闭组成的联合等待图也须无环；聚合自身依赖计入。维护主 Issue 计划索引和修复映射，保留历史及执行证据。只为授权范围创建/复用票，不实现或合并；选票负责后续标签解阻。
    model:
      provider: kimi-coding
      modelId: k3-256k
  developer:
    persona: |
      最小实现当前 implementation 叶票，复用现有代码和测试，仅在指定 feature 分支提交推送，经 feature→milestone PR 交付；不合并关票，不直接推 milestone/基线。返工复用同一开放 PR，逐项核实发现后修复或给绑定修订的具体反证，无代码变化不制造空提交。自测如实记录命令、对象 SHA、结果及未测边界，必需验证无法完成则 BLOCK。
    reuse: continuable
    model:
      provider: commandcode
      modelId: deepseek/deepseek-v4.1-flash
  code-reviewer:
    persona: |
      独立审查并处置发现，实现只读，不合并关票。审查评论合并报告与决策，每项发现给证据与处置；无必修项且必需验证充分才批准，延期需必要授权及后续入口，无法核验/范围争议 BLOCK。批准仅适用于确切仓库/PR/base/head；同 SHA 新反证也可使批准失效。集成审查不能按票数免除，可复用精确修订证据但补查基线变化、跨票交互与整体验收。内部批准不代替仓库要求的 GitHub approval。
    model:
      provider: kimi-coding
      modelId: k3
judgeRole:
  persona: |
    只读核验当前 claim 的共同与所选 result criteria：事实支持才 ACCEPT，明确不符 REJECT，缺信息或查询能力 NEED_CONTEXT；不代 Actor 选结果。
    从 handoff 的 Issue URL、runId、初始化及当前证据评论定位对象，按需查询真实 PR/提交/检查状态；评论是可追溯记录，不把 Actor 自述或 Manager 的通过宣告当独立事实，补证须有可核验查询来源。
    不要求 run.md、合同副本或短报告本地文件；长报告评论已有充分证据时不为缺本地目录额外阻塞，确需全文但不可访问才请求补证。按冻结 criteria 判断，不从参考文档增加门槛。
    主 Issue 的计划及本对象证据评论定位 Milestone 和任务；主 Issue 已关闭不自动构成失败，按所选结果合同核验。初始化前取消只要求可核验取消依据和资源现状，不要求尚未建立的 Issue 或运行材料。Manager 是当前 Actor 时，其自述不构成独立补证。
  model:
    provider: zai-coding-cn
    modelId: glm-5.3-flash
  tools:
    deny:
      - edit
      - write
workflow:
  startNode: initialize-and-plan
  nodes:
    initialize-and-plan:
      execution:
        type: actor-task
        role: manager
        instruction: |
          1. 按项目 GitHub tracker 或 Issue URL/git remote 核验唯一 owner/repo 与 workspace。明确单仓范围、验收/不做事项、目标基线、Milestone/分支身份及创建/推送/两级合并/关票授权；已有明确授权直接沿用，复杂或不清需求按实际可用技能澄清，清晰需求直接规格化。涉及子仓改动或跨仓交付则 BLOCK，不能把另一个仓库的 Issue/分支纳入。保留用户改动，不强推、硬重置、绕过保护或部署；未授权前不创建资源。
          2. 继续交付时取得真实 runId，确认干净工作树，fetch 并安全更新基线，从确切 SHA 创建推送或核验复用 milestone 分支，记录原始 baseCommit。创建/复用开放 Milestone 与唯一主 Issue，已有规格票复用；重入先核对已产生资源、初始化/计划评论及分支起点，归属不明 BLOCK，不重复建票或覆盖原始起点。
          3. 在本节点完成规划：简单任务以原主票作为 implementation，复杂任务用实际可用 to-tickets 创建/复用子票。主 Issue 和全部本轮子票关联同一仓库的指定 Milestone。implementation 承担全部实现且为叶票；aggregate 仅聚合、无独立验收；integration-acceptance 仅限有明确独立集成验收的主票，实现须拆入叶票，该主票不得成为实施/聚合票等待关闭的依赖。父子关系及“显式 Blocked by + 聚合等待子票关闭”的联合等待图均无环，计入聚合自身依赖。
          4. 计划按最新有效授权确定必交集：获准移出/取消保留历史与依据、不计入必交集，同步验收归属、依赖及聚合子集；仅移出 Milestone/改标签不能排除任务。计划索引覆盖主规格，记录任务 URL、taskKind、父子/依赖、验收归属、执行授权/人工 hold 与变更依据，同步远端依赖及 Blocked by 引用。仅已授权、无 hold 且依赖满足的叶票标 ready-for-agent，至少一张可执行 implementation；遗漏、死锁、范围争议或无可执行票 BLOCK。
          5. 在主 Issue 成功发布初始化及计划记录，可合为一条评论并让两个入口指向同一 URL。记录 workflowId/runId、节点 initialize-and-plan、workspace/owner/repo、Milestone/主票、规格与验收/不做范围、授权、baseBranch/milestoneBranch/原始 baseCommit、merge commit 策略、完整计划及跟踪版本2026-09-18.3。重入同输入/结论复用，变更追加引用旧记录；gh 显式指定仓库，多行用 --body-file，写入结果不明先查远端。GitHub 不可写时说明并 BLOCK，不把草稿当发布；不建 run.md、合同副本或本地短报告。仅长篇复杂报告存 workspace 内 ignored 未跟踪目录，并在 Issue 留关键摘要、位置、适用修订与哈希；评论不能只贴本地路径。
          6. 只有初始化和计划全部完成、用户继续授权仍有效时 ready，不能将拆票留给不存在的后继规划节点。handoff 提供真实 runId、主 Issue/初始化/最新计划评论 URL、Milestone/仓库/workspace、规格与分支原始起点、任务索引及约束。用户最新有效决定为明确取消时 cancelled，留下可读取取消依据、外部资源现状与清理约束；已有主票用评论，尚未建票用可读取用户确认/会话记录，不为取消创建资源，不自动清理。未回复或技术故障不是取消。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        ready:
          criteria: |
            用户最新有效决定为继续交付，范围、验收和所需授权有依据。仅涉及同一仓库，指定 Milestone/主 Issue 开放且归属明确，主票及本轮子票关联该 Milestone；milestone 分支已从核验基线 SHA 建立/可追溯复用并推送，原始起点未覆盖，工作树干净。
            本 run 主 Issue 初始化和完整计划评论已成功发布（允许同一评论），记录真实 runId、仓库/workspace、范围/授权、Milestone、分支起点、merge commit 和跟踪版本。必交集覆盖主规格验收；获准移出/取消保留依据及历史并同步依赖/验收/聚合子集，无未经授权遗漏。全部实现归 implementation 叶票，aggregate 无独立验收，integration-acceptance 仅为明确独立集成验收主票、无隐藏实现且不成为实施/聚合票的等待依赖。父子关系无环，显式依赖与聚合等待子票组成的联合等待图（含聚合自身依赖）无环，远端依赖一致。至少一张授权、无人工 hold、依赖满足且 ready-for-agent 的可执行 implementation。
            handoff 含主 Issue/runId/初始化/最新计划/任务与分支身份，后继可直接选票；无需本地台账或合同副本。仅长报告落盘时需已忽略未跟踪，评论有关键摘要/路径/修订/哈希。
          target:
            node: run-issue-cycle
        cancelled:
          criteria: |
            用户最新有效决定为明确取消，有独立可读取依据和资源现状/清理约束摘要，未伪称交付；初始化前不要求尚未建立的 Issue、Milestone、评论或本地材料，未回复/技术故障不算取消。
          target:
            return: cancelled
    run-issue-cycle:
      execution:
        type: child-workflow
        workflowId: issue-cycle
      onReturn:
        integration-ready:
          node: final-review
    final-review:
      execution:
        type: actor-task
        role: code-reviewer
        instruction: |
          1. 由交接定位初始化、最新计划、实现/集成准备、上轮审查和相关新澄清；核对当前指定开放 PR，固定 base/head/mergeBase。主 Issue 可以已关闭，不影响读取规格和发布集成评论。用实际可用 code-review 技能，纯文档/注释小改可直接审查。必须覆盖全部交付范围、目标基线变化、新增/合并差异、跨票交互、主 Issue 独立集成验收（如有）及旧必修项。可引用逐票审查的精确修订证据并补查差异与交互；不能按票数免审或跨 PR 沿用批准，无法证明覆盖则完整审查。
          2. 在主 Issue发布 rNNN 审查评论，记录 runId、对象/修订、前序链接、范围/方法、验收/验证边界、稳定发现 ID、逐项修复/延期/不成立及依据。无必修项且必需验证齐备才 approved；有范围内可执行必修清单才 changes-required。技术/证据/权限缺口及范围争议 BLOCK；延期需必要授权和后续入口。
          3. approved 写 approvedBase/approvedHead；changes-required 明确本轮无批准、旧批准失效。PR 只留结论摘要和评论链接。首次 r001；修订、新反证、验证材料或结论变化均开新轮，即使 SHA 相同；相同执行且输入/结论相同才复用。发布前后复核修订，漂移则标记失效并 BLOCK，不提交旧批准。
          4. 普通报告直接评论，长篇复杂报告按公共规则存 ignored 目录并登记摘要/路径/修订/哈希；不要求独立 decision 文件。handoff 保留真实 runId、主 Issue/初始化评论/最新计划评论 URL、Milestone 身份、本对象 Issue/证据评论 URL、PR/修订与后续约束；子流程进出也保留这些入口。批准交接批准修订，返工交接必修清单与验收。
      checker:
        checkerId: judge.claim-correct
        config:
          criteria: |
            指定 PR 开放且归属/源目标正确；主 Issue 状态不作为审查前提；本 run 的主 Issue审查评论已发布，绑定仓库/PR/base/head/mergeBase、轮次及前序证据，提交时修订未漂移。必须覆盖全部交付范围、目标基线变化、新增/合并差异、跨票交互、主 Issue 独立集成验收（如有）及旧必修项。可引用逐票审查的精确修订证据并补查差异与交互；不能按票数免审或跨 PR 沿用批准，无法证明覆盖则完整审查。发现逐项有处置和依据，延期有必要授权/后续入口，无未解决范围争议；PR 指向同修订评论，handoff 含运行入口和本轮评论。使用长报告时评论有摘要/路径/修订/哈希且实际所需内容可读，不要求本地短报告。
      results:
        approved:
          criteria: |
            本轮评论明确无未解决本次必修项、必需验证齐备，approvedBase/approvedHead 与当前 PR 相符；无后续作废结论、修订变化或尚未覆盖的新失败验证/实质反证。
          target:
            node: close-milestone
        changes-required:
          criteria: |
            本轮评论有既定范围内、具依据和可执行验收的必修清单，本轮无有效批准且旧批准明确失效；环境/权限问题不伪装产品返工。
          target:
            node: plan-remediation
    close-milestone:
      execution:
        type: actor-task
        role: coordinator
        instruction: |
          1. 读初始化、最新计划、当前对象有效批准及后续相关证据；查真实 PR 状态，缺证据、冲突、检查待完成、技术/权限或保护不足 BLOCK。合并前完整核对最新已授权必交集和获准移出/取消依据，仅允许已登记且本轮验收覆盖的集成验收主票仍开放；Milestone 应开放，若 PR 已合并则按后续步骤核验并补收尾。
          2. 开放 PR 的 base/head 偏离批准，或批准未覆盖与既定验收相关的新失败验证/实质反证：在主 Issue发布失效评论，引用原批准、新旧修订/新证据和原因，提交 stale-review，不合并关票。超出范围仍 BLOCK。已合并不因正常目标 tip 前进重审，不把事后检查冒充合并前证据。
          3. 批准有效则在主 Issue先成功发布合并前核验评论：runId、PR、批准链接、approvedBase/approvedHead、merge commit 方式、时间及所需 checks/保护证据或不适用依据。紧邻合并重查 base/head，以工具 head 条件保护合入指定基线；不绕过保护，仓库不允许 merge commit 则 BLOCK。重查变化转 stale-review；结果不明先查询不重复操作。
          4. 已合并时读取当时批准与合并前记录，独立核验实际源 head 匹配批准 head、mergeCommit 第一父节点等于 approvedBase，fetch 后远端目标包含批准 head/mergeCommit，实施 PR 还核验包含本票实现提交。不能证明或不匹配则记录事实并 BLOCK，不自动回滚或手动关票；自动关票如实记录。分页核对计划及 Milestone 全部 Issue，以最新已授权必交集验收，获准移出/取消保留依据且不计入必交集；implementation/aggregate 已关闭且有本 run 交付/聚合完成证据，仅可留已登记的 integration-acceptance 主 Issue，其全部独立验收已由本轮批准覆盖。实际集成验证成功后，在主 Issue 发布交付评论，记录范围、验证/延期边界、批准/合并前核验链接和 merge SHA；为仍开放的集成验收主票留下依据并关闭。再次完整核对最新必交任务已完成关闭，Milestone 无剩余未解释开放票（获准移出票应已移出）、无未解释移出，才关闭 Milestone。已关闭对象核验归属和依据后复用。
          5. 安全切回并快进指定基线，工作树干净；保留分支和用户内容。handoff 保留真实 runId、主 Issue/初始化评论/最新计划评论 URL、Milestone 身份、本对象 Issue/证据评论 URL、PR/修订与后续约束；子流程进出也保留这些入口。delivered 附交付/合并前评论与合并证据；stale-review 附失效评论与重审输入。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        delivered:
          criteria: |
            指定 PR 已以 merge commit 合入指定基线，实际源 head 匹配有效批准；本 run 在合并前已发布核验评论，含批准链接、approvedBase/approvedHead、时间、方式和当时必要检查/保护依据，无尚未覆盖的新失败验证/实质反证。mergeCommit 第一父节点独立核验等于 approvedBase，远端目标包含批准 head/mergeCommit，实施 PR 还包含本票实现提交。最新已授权必交集非空且有 implementation、全部有完成依据并关闭，移出/取消有授权且保留历史，主票独立集成验收（如有）已覆盖并有关闭依据，无未解释移出，Milestone 无剩余未解释开放票且已关闭；主 Issue 集成交付评论含范围、合并证据、实际验证与延期边界。handoff 保留主 Issue、runId、初始化/计划及本次证据入口；工作树干净且位于指定基线，重入无重复副作用。
          target:
            return: delivered
        stale-review:
          criteria: |
            指定 PR 仍开放且归属明确，Milestone 开放，主 Issue 可已关闭；存在原有效批准，但 base/head 变化或出现批准未覆盖的既定验收内新失败验证/实质反证。主 Issue失效评论已发布，含原批准、新旧修订、新证据（如有）、原因；未执行合并或关票，handoff 保留运行入口及重审对象。
          target:
            node: final-review
    plan-remediation:
      execution:
        type: actor-task
        role: planner
        instruction: |
          1. 读本 run 最新计划与本轮集成 changes-required 评论，核对 Milestone 和集成 PR 仍开放，缺明确必修目标/外部关闭/范围争议则 BLOCK，不擅自重开。旧主票可已关闭，继续作入口。
          2. 仅为当前范围内必修项创建/复用 implementation 修复票，按集成 PR/发现 ID/已有映射核对，避免同一未解决发现跨轮重复建票；已有关闭修复票有新复发事实则引用历史新建后续票。复杂修复按需拆分，记录验收与依赖，明确无 hold 的可实施票标 ready-for-agent。任务核验使用最新已授权必交集；获准移出/取消票保留历史和授权依据、不计入必交集，同步调整验收归属及聚合子票集合，单纯移出 Milestone 或改标签不能排除任务。最新必交集仍须至少一张 implementation，否则 BLOCK。 implementation 是承担全部实现的叶票；aggregate 无独立验收、聚合子票；integration-acceptance 仅限明确列出独立集成验收的主 Issue，实现须拆入叶票，不能成为实施或聚合票等待关闭的依赖。父子关系无环，显式 Blocked by 与聚合等待子票关闭组成的联合等待图也须无环；聚合自身依赖计入。
          3. 主 Issue 的计划评论保留完整任务索引：Issue URL、taskKind、父子/依赖、验收归属、执行授权/人工 hold、已批准移出/取消及原因，修复票另记发现 ID→Issue 映射。评论追加并指向前版，不维护另一份实时状态表。保留已完成票、历史批准/合并及移出依据，追加本轮修复范围和映射；不能仅改分类绕过实现，不为技术失败或无授权优化建产品票。至少一张可执行修复票，反复返工无新证据则 BLOCK。handoff 保留真实 runId、主 Issue/初始化评论/最新计划评论 URL、Milestone 身份、本对象 Issue/证据评论 URL、PR/修订与后续约束；子流程进出也保留这些入口。
      checker:
        checkerId: judge.claim-correct
        config: {}
      results:
        planned:
          criteria: |
            同一开放 Milestone/集成 PR 下，主 Issue 新计划评论绑定本轮集成审查与发现 ID→修复票映射，至少一张授权、无 hold、依赖满足且 ready-for-agent 的未完成 implementation 修复票；验收清楚，无未解释重复/范围扩张，保留历史和已完成范围。任务核验使用最新已授权必交集；获准移出/取消票保留历史和授权依据、不计入必交集，同步调整验收归属及聚合子票集合，单纯移出 Milestone 或改标签不能排除任务。最新必交集仍须至少一张 implementation，否则 BLOCK。 implementation 是承担全部实现的叶票；aggregate 无独立验收、聚合子票；integration-acceptance 仅限明确列出独立集成验收的主 Issue，实现须拆入叶票，不能成为实施或聚合票等待关闭的依赖。父子关系无环，显式 Blocked by 与聚合等待子票关闭组成的联合等待图也须无环；聚合自身依赖计入。handoff 含初始化/最新计划/必修来源与映射。
          target:
            node: run-issue-cycle
  returns:
    - delivered
    - cancelled
childWorkflows:
  issue-cycle:
    startNode: select-next-issue
    nodes:
      select-next-issue:
        execution:
          type: actor-task
          role: coordinator
          instruction: |
            1. 读初始化和最新计划，核对指定 Milestone 开放。以最新已授权必交集为完成范围，核对移出/取消的授权及保留历史，不将这些票误列为待交付； 分页完整核对 Milestone Issue（排除 PR）与本 run 最新计划，非空且至少一张 implementation；未分类、无授权移出/取消、成员冲突或查询不全均 BLOCK。关闭不等于交付：必交集中的 implementation 必须有对应批准/合并/目标包含证据；无依据的外部关闭 BLOCK。检查联合等待图及授权/人工暂停无新冲突。
            2. 自底向上关闭无独立验收的 aggregate，仅在最新必交子票全部有完成依据并关闭、自身显式依赖也关闭且无有效 hold 后评论留依据并关闭，直至无可关闭聚合票。就绪标签由本节点集中核对：仅对已授权且全部依赖关闭、无人工 hold/needs-info/ready-for-human 的 implementation 修复工作流管理的 ready-for-agent；人工移除标签/撤销授权或来源不明不能自动恢复，记录阻塞并协调。
            3. 有 open、授权、ready-for-agent 且依赖全关闭/为空的 implementation 叶票，按依赖优先级再编号升序选择。安全更新 milestone，从确切 SHA 建立推送 feat/<issue-number>-<slug>；已有分支按原领取评论核验归属、原始 baseCommit 及祖先关系，不以当前 tip 代替起点，不明则 BLOCK。当前票发布领取评论绑定 runId、初始化/计划、仓库、feature/milestone、原始 baseCommit；selected 交接此入口。
            4. 无候选时，以最新已授权必交集为准，只有非空 implementation 全部有交付依据且关闭、aggregate 全部完成关闭、剩余开放票为空或仅已登记独立验收的 integration-acceptance 主票，才准备集成。仍有未完成票/hold 或无法解释的对象则逐项说明 BLOCK，不能冒充耗尽。
            5. 耗尽时安全回到更新后的 milestone，确认工作树干净、已推送且无未解释本地提交；创建/复用唯一指定 milestone→基线开放 PR，保留正文，不合并。已关闭/合并、身份歧义或无交付差异 BLOCK。主 Issue 发布集成准备评论，含完整任务核验依据、PR/base/head、范围/实现审查链接和待集成验收项（无则明确无）。integration-ready 返回 root 审查。handoff 保留真实 runId、主 Issue/初始化评论/最新计划评论 URL、Milestone 身份、本对象 Issue/证据评论 URL、PR/修订与后续约束；子流程进出也保留这些入口。
        checker:
          checkerId: judge.claim-correct
          config: {}
        results:
          selected:
            criteria: |
              Milestone 开放，完整分页成员与计划相符，无未解释移出/取消/未分类或联合等待冲突。本票 open、implementation 叶票、已授权且无人工 hold、ready-for-agent、依赖均满足；本次聚合关闭有子票完成/自身依赖满足证据，标签未越过人工限制。feature 分支已从可追溯原始 baseCommit 建立/复用并推送，身份/祖先关系明确，未覆盖用户改动；本票领取评论已发布，handoff 保留本 run 初始化/最新计划/领取与分支身份。
            target:
              node: deliver-one-issue
          integration-ready:
            criteria: |
              Milestone 开放，完整分页核对最新已授权必交集与计划一致且非空，获准移出/取消保留历史与依据且不计入必交集，至少一张 implementation、全部有合并/目标包含交付依据并关闭，aggregate 有子票/自身依赖完成依据并关闭；无未解释移出/取消或未分类，剩余开放票仅可为已登记独立验收的主票，无隐匿实现。唯一集成 PR 开放，源/目标为指定 milestone/基线，SHA 已推送且与证据一致，工作树干净且无未解释本地提交。主 Issue 集成准备评论含上述依据、范围/逐票证据、PR/base/head、待集成验收项，handoff 保留本 run 初始化/最新计划/准备入口。
            target:
              return: integration-ready
      deliver-one-issue:
        execution:
          type: child-workflow
          workflowId: issue-delivery
        onReturn:
          delivered:
            node: select-next-issue
    returns:
      - integration-ready
  issue-delivery:
    startNode: implement
    nodes:
      implement:
        execution:
          type: actor-task
          role: developer
          instruction: |
            1. 读本票、初始化/最新计划/领取及最新审查评论，核对工作树、featureBranch、原始 baseCommit 与目标 milestone。简单文档直接实现，编码用实际可用 implement，按需 diagnosing-bugs/tdd；技能产物按本流程留远端证据。范围或身份不明 BLOCK。
            2. 交付本票验收或本轮必修项；逐项核实发现，成立则修复，不成立给具体反证交 reviewer，不自行视为批准；无代码变化可复用 head，不制造空提交。完成适用自测/必要回归，必需验证不能执行 BLOCK，无适用测试说明依据。
            3. 只提交本任务实现及必要忽略规则，推送 feature，创建/复用唯一 feature→milestone 开放 PR；返工复用原 PR，已关闭/合并、无差异或归属冲突 BLOCK，不合并关票、不部署。运行材料不得提交。
            4. 本票发布实现评论，含 runId、领取/初始化/计划/前轮审查链接、PR/base/head/实现 SHA、验收覆盖、命令/结果/未测边界与修复/反证；PR 仅附摘要与评论链接。长报告按公共规则忽略并登记摘要/路径/修订/哈希。handoff 保留真实 runId、主 Issue/初始化评论/最新计划评论 URL、Milestone 身份、本对象 Issue/证据评论 URL、PR/修订与后续约束；子流程进出也保留这些入口。
        checker:
          checkerId: judge.claim-correct
          config: {}
        results:
          implemented:
            criteria: |
              本 implementation Issue 及 Milestone 开放，授权范围内验收实现有证据；必修项逐项有修复或待 reviewer 核验的具体反证。指定 feature 已提交推送，唯一开放 PR 源/目标为 feature/milestone，head 与交接一致，diff 无无关用户改动/运行产物；适用自测/必要回归有命令、对象 SHA、真实结果或不适用依据，无未完成必需验证。Issue 实现评论已发布并被 PR 引用，含验收/修订/验证边界及前序链接；长报告如有已忽略未跟踪且评论有摘要/路径/修订/哈希。handoff 保留主 Issue/runId/初始化/最新计划/领取/实现入口。
            target:
              node: review
      review:
        execution:
          type: actor-task
          role: code-reviewer
          instruction: |
            1. 由交接定位初始化、最新计划、实现/集成准备、上轮审查和相关新澄清；核对当前指定开放 PR，固定 base/head/mergeBase。本实施 Issue 应开放。用实际可用 code-review 技能，纯文档/注释小改可直接审查。覆盖本票验收、完整 PR diff、自测/回归及旧必修项，逐项核验开发者反证；增量复用必须补查所有变化和交互影响。
            2. 在本实施 Issue发布 rNNN 审查评论，记录 runId、对象/修订、前序链接、范围/方法、验收/验证边界、稳定发现 ID、逐项修复/延期/不成立及依据。无必修项且必需验证齐备才 approved；有范围内可执行必修清单才 changes-required。技术/证据/权限缺口及范围争议 BLOCK；延期需必要授权和后续入口。
            3. approved 写 approvedBase/approvedHead；changes-required 明确本轮无批准、旧批准失效。PR 只留结论摘要和评论链接。首次 r001；修订、新反证、验证材料或结论变化均开新轮，即使 SHA 相同；相同执行且输入/结论相同才复用。发布前后复核修订，漂移则标记失效并 BLOCK，不提交旧批准。
            4. 普通报告直接评论，长篇复杂报告按公共规则存 ignored 目录并登记摘要/路径/修订/哈希；不要求独立 decision 文件。handoff 保留真实 runId、主 Issue/初始化评论/最新计划评论 URL、Milestone 身份、本对象 Issue/证据评论 URL、PR/修订与后续约束；子流程进出也保留这些入口。批准交接批准修订，返工交接必修清单与验收。
        checker:
          checkerId: judge.claim-correct
          config:
            criteria: |
              指定 PR 开放且归属/源目标正确；本实施 Issue 开放；本 run 的本实施 Issue审查评论已发布，绑定仓库/PR/base/head/mergeBase、轮次及前序证据，提交时修订未漂移。覆盖本票验收、完整 PR diff、自测/回归及旧必修项，逐项核验开发者反证；增量复用必须补查所有变化和交互影响。发现逐项有处置和依据，延期有必要授权/后续入口，无未解决范围争议；PR 指向同修订评论，handoff 含运行入口和本轮评论。使用长报告时评论有摘要/路径/修订/哈希且实际所需内容可读，不要求本地短报告。
        results:
          approved:
            criteria: |
              本轮评论明确无未解决本次必修项、必需验证齐备，approvedBase/approvedHead 与当前 PR 相符；无后续作废结论、修订变化或尚未覆盖的新失败验证/实质反证。
            target:
              node: complete-issue
          changes-required:
            criteria: |
              本轮评论有既定范围内、具依据和可执行验收的必修清单，本轮无有效批准且旧批准明确失效；环境/权限问题不伪装产品返工。
            target:
              node: implement
      complete-issue:
        execution:
          type: actor-task
          role: coordinator
          instruction: |
            1. 读初始化、最新计划、当前对象有效批准及后续相关证据；查真实 PR 状态，缺证据、冲突、检查待完成、技术/权限或保护不足 BLOCK。开放 PR 要求本票仍开放、Milestone 开放；已合并 PR 按当时记录核验并补收尾。
            2. 开放 PR 的 base/head 偏离批准，或批准未覆盖与既定验收相关的新失败验证/实质反证：在本实施 Issue发布失效评论，引用原批准、新旧修订/新证据和原因，提交 stale-review，不合并关票。超出范围仍 BLOCK。已合并不因正常目标 tip 前进重审，不把事后检查冒充合并前证据。
            3. 批准有效则在本实施 Issue先成功发布合并前核验评论：runId、PR、批准链接、approvedBase/approvedHead、merge commit 方式、时间及所需 checks/保护证据或不适用依据。紧邻合并重查 base/head，以工具 head 条件保护合入指定 milestone 分支；不绕过保护，仓库不允许 merge commit 则 BLOCK。重查变化转 stale-review；结果不明先查询不重复操作。
            4. 已合并时读取当时批准与合并前记录，独立核验实际源 head 匹配批准 head、mergeCommit 第一父节点等于 approvedBase，fetch 后远端目标包含批准 head/mergeCommit，实施 PR 还核验包含本票实现提交。不能证明或不匹配则记录事实并 BLOCK，不自动回滚或手动关票；自动关票如实记录。实际合并验证成功后，在本实施 Issue 发布交付评论，记录批准/合并前核验链接、实现与 merge SHA、目标包含证据、验证/延期边界，然后关闭 Issue；自动或已有关闭如实核验。此处不扫描其他票或维护解阻标签，交下一轮选票统一处理。
            5. 安全切回并快进指定 milestone 分支，工作树干净；保留分支和用户内容。handoff 保留真实 runId、主 Issue/初始化评论/最新计划评论 URL、Milestone 身份、本对象 Issue/证据评论 URL、PR/修订与后续约束；子流程进出也保留这些入口。delivered 附交付/合并前评论与合并证据；stale-review 附失效评论与重审输入。
        checker:
          checkerId: judge.claim-correct
          config: {}
        results:
          delivered:
            criteria: |
              指定 PR 已以 merge commit 合入指定 milestone 分支，实际源 head 匹配有效批准；本 run 在合并前已发布核验评论，含批准链接、approvedBase/approvedHead、时间、方式和当时必要检查/保护依据，无尚未覆盖的新失败验证/实质反证。mergeCommit 第一父节点独立核验等于 approvedBase，远端目标包含批准 head/mergeCommit，实施 PR 还包含本票实现提交。本实施 Issue 已关闭，交付评论保留批准/核验/合并与验证边界，未越权维护其他票。handoff 保留主 Issue、runId、初始化/计划及本次证据入口；工作树干净且位于指定 milestone 分支，重入无重复副作用。
            target:
              return: delivered
          stale-review:
            criteria: |
              指定 PR 仍开放且归属明确，本实施 Issue 与 Milestone 开放；存在原有效批准，但 base/head 变化或出现批准未覆盖的既定验收内新失败验证/实质反证。本实施 Issue失效评论已发布，含原批准、新旧修订、新证据（如有）、原因；未执行合并或关票，handoff 保留运行入口及重审对象。
            target:
              node: review
    returns:
      - delivered
