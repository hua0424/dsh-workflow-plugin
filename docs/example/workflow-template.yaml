# =============================================================================
# agent-workflow/v2 工作流配置模板
#
# 使用方法：复制本文件到 %DSH_HOME%\workflows\<workflow-id>.yaml 后修改。
#   - 文件名（去掉 .yaml）即 workflowId，必须匹配 [a-z][a-z0-9-]*（.yml 会被忽略）。
#   - 放入 catalog 后用 `/dsh-flow list` 校验；invalid 文件只阻塞自身并显示诊断。
#   - 本模板原样即可通过 schema + 静态校验；按需增删 roles / nodes。
#
# model 路由（roles.<key>.model 与 judgeRole.model，格式相同）：
#   model:
#     provider: deepseek     # provider 路由，trim 后 1..64 字符
#     modelId: glm-4.7       # 模型 id，trim 后 1..128 字符
#   - 省略整个 model 块 = Run 启动时继承当前 Manager 的模型路由并冻结。
#   - `manager` 是保留 roleKey：不能出现在 roles 中，YAML 也不配置它的
#     model（Manager 始终由当前主会话承担，跟随主会话模型）。
#   - 运行中可由 Manager 调用 workflow_set_role_model({ roleKey, provider,
#     modelId }) 覆盖（roleKey 填 "judge" 即 Judge）：Worker 的覆盖在其
#     actor 空闲时生效（下次派发创建 replacement），Judge 的覆盖自下一次
#     Judge 重建起生效；目标 Worker 有活跃 turn 或正在等待判定/修正时拒绝。
#
# YAML 限制：单文档；禁止 duplicate key / anchor / alias / merge key /
# 自定义 tag；不支持模板插值。
# =============================================================================

schemaVersion: agent-workflow/v2

# -----------------------------------------------------------------------------
# compactThresholdTokens（可选，顶层，与 roles/judgeRole/workflow 同级）：
# Node 边界 compact 的 token 阈值。Role Actor 每次进入新 Node 前，Host 用
# DSH replay-aware token meter 测量其已物化 Session 的 totalTokens：
#   - totalTokens 严格大于阈值 → 执行现有 compact；
#   - 等于或低于阈值 → 跳过 compact，直接派发；
#   - 缺省（不写本字段）→ 保持无条件尝试 compact 的既有行为。
# 单位是估算 token（非字符/消息数）；值必须是 JavaScript 安全正整数。
# 阈值随 Run 启动冻结进 Definition Snapshot，Run 中途改文件不影响当前 Run。
# 取消下一行注释即启用（示例：32000 tokens）。
# -----------------------------------------------------------------------------
# compactThresholdTokens: 32000

# -----------------------------------------------------------------------------
# Worker Role：按需创建并复用的 continuable subagent。
# `manager` 与 `judge` 是保留 roleKey，禁止出现在 roles 中。
# 每个 role 可配：persona（必填）/ model（可选）/ tools.deny（可选，非空）。
# -----------------------------------------------------------------------------
roles:
  # 示例 1：显式指定 model 路由的 worker。
  developer:
    persona: |
      执行当前 Node 指派的任务：按 instruction 与 handoff 完成实现/修改，
      运行所需的检查。仅通过 node_claim / node_block 汇报结果——纯文本
      回复不会提交你的结果。node_claim（或 node_block）必须是你本轮的
      最后一个动作，每轮最多调用一次；claim 成功后绝不再调用任何工具。
    model:
      provider: deepseek
      modelId: glm-4.7

  # 示例 2：不带 model（继承 Manager 路由）并用 tools.deny 收窄工具面。
  reviewer:
    persona: |
      以独立且只读的方式评审工作：不修改被评审产物，不提交、推送或更改
      任何外部状态。评审完成后即声明 completed（无论结论如何），并在
      handoffContext 中记录结论（如 approved yes/no 与阻断性发现）。
      仅通过 node_claim / node_block 汇报；它们必须是你本轮的最后一个
      动作，每轮最多调用一次。
    tools:
      deny: [edit, write]

# -----------------------------------------------------------------------------
# Judge Role：每 Node fresh 的只读判定者；工具面固定（read/glob/grep/
# read_image/workflow_inspect_* + judge_claim），YAML 不配置 tools。
# -----------------------------------------------------------------------------
judgeRole:
  persona: |
    独立核对当前 claim 与真实的工作区/远端事实；绝不修改被评估的产物。
    仅通过 judge_claim({nodeToken, result: ACCEPT|REJECT|NEED_CONTEXT,
    reason}) 提交判定：ACCEPT 表示确认 claim 可信（节点按执行者声称的
    方式结束）；REJECT 的 reason 必须具体写明哪里不对、如何纠正——它会
    逐字作为纠正指令发回执行者；仅在确实缺少必要信息时才用 NEED_CONTEXT。
  model:
    provider: deepseek
    modelId: glm-4.7

# -----------------------------------------------------------------------------
# 根工作流图。startNode 必须是 role: manager 的 actor-task 节点。
# 节点 id 必须匹配 [a-z][a-z0-9-]*；所有节点需从 startNode 可达，
# 且至少存在一条到 END 的路径。
# -----------------------------------------------------------------------------
workflow:
  startNode: plan
  nodes:
    plan:
      execution:
        type: actor-task
        role: manager
        instruction: |
          理解用户目标并制定计划：确定交付范围与验收标准。声明 completed
          时，handoffContext 必须携带后续节点所需上下文（目标复述、任务
          范围、验收标准、相关仓库/分支等）。
      checker:
        checkerId: judge.claim-correct
        config:
          criteria: |
            计划与用户目标一致、范围明确、验收标准可检查，且 handoff
            携带后续节点所需的上下文。
      onPass: implement

    implement:
      execution:
        type: actor-task
        role: developer
        instruction: |
          按 handoff 与 instruction 完成实现。声明 completed 时，在
          handoffContext 中携带实现摘要与关键产物（涉及文件/提交等），
          供 Judge 与后续节点核对。
      checker:
        checkerId: judge.claim-correct
        config:
          criteria: |
            实现与 handoff 声明一致，所需检查已执行，handoff 携带实现
            摘要与关键产物。
      onPass: review
      onFail: implement      # FAIL 沿 onFail 退回重做；onFail 不能指向 END

    review:
      execution:
        type: actor-task
        role: reviewer
        instruction: |
          以只读方式评审 implement 的结果。评审完成后即声明 completed
          （无论结论如何），并在 handoffContext 中记录 approved（yes/no）
          与阻断性发现（approved 时为空）。
      checker:
        checkerId: judge.claim-correct
        config:
          criteria: |
            评审确实以只读方式完成且结论与事实一致；仅当 approved=yes 且
            无阻断性发现时 PASS，否则 FAIL。
      onPass: END
      onFail: implement

# -----------------------------------------------------------------------------
# builtin-program 节点（可选，按需取消注释并接入 onPass/onFail）：
#   programId 仅支持内置程序，当前为 github.initialize-milestone /
#   github.all-milestone-issues-complete（新增需改插件源码）。
#   instruction 可选；FAIL 未配置 onFail 时进 BLOCK，由 Manager 用
#   node_resolve_program 手工裁决 PASS/FAIL。
# -----------------------------------------------------------------------------
#    run-program:
#      execution:
#        type: builtin-program
#        programId: github.initialize-milestone
#        instruction: |
#          通过 node_run_program 运行，参数取自上一节点 handoff。
#      onPass: review
#      onFail: plan

# -----------------------------------------------------------------------------
# child-workflow 节点（可选）：引用下方 childWorkflows 中定义的子工作流；
# 禁止递归引用，也不能引用根工作流本身。子工作流完成后沿 onPass 继续。
# -----------------------------------------------------------------------------
#    run-child:
#      execution:
#        type: child-workflow
#        workflowId: sub-flow
#      onPass: END

# childWorkflows:
#   sub-flow:
#     startNode: child-start
#     nodes:
#       child-start:
#         execution:
#           type: actor-task
#           role: developer
#           instruction: |
#             子工作流任务：按 handoff 完成并汇报。
#         checker:
#           checkerId: judge.claim-correct
#           config:
#             criteria: |
#               子任务完成且 handoff 携带结果。
#         onPass: END
