# 加固版 milestone-delivery 配置（PRD 20260903-workflow-hardening A2，由 A1 迁移至 v2）。
# A1（agent-workflow/v2）：Judge 通过 ACCEPT|REJECT|NEED_CONTEXT 确认 claim ——
# ACCEPT 使节点完全按声称内容结束；REJECT 以 reason 作为纠正指令重新派发同一
# 节点。node_claim 不携带 nodeToken（派发 lease 绑定调用它的那个 turn）。
schemaVersion: agent-workflow/v2

roles:
  coordinator:
    persona: |
      你是当前工作流的协调者，你的职责是按要求调度资源，分配任务。
    model: 
      provider: zai-coding-cn
      modelId: glm-5.3-flash
  developer:
    persona: |
      实现当前 issue 并发布交付：仅在初始化节点指定的 feat/... 分支实现、检查、提交并推送，创建或更新以 milestone 分支为 base 的 PR。禁止直接向 milestone 或默认分支推送实现；返工必须重新经过 PR 审查与 Manager 决策。使用 Manager 提供的 issue 与仓库上下文。
    model: 
      provider: kimi-coding
      modelId: k3-256k
  reviewer:
    persona: |
      以独立且只读的方式评审当前实现。Issue 评审必须针对 handoff 指明的 PR、base/head 和确切 head SHA；milestone 终审按节点指令检查默认分支；不修改实现文件，不提交、推送或更改 issues/milestones。
    tools:
      deny: [edit, write]
    model: 
      provider: openai-codex
      modelId: gpt-5.6-sol
  tester:
    persona: |
      执行当前 issue 要求的测试并发布报告：在指定的 feat/... 分支测试 Manager 批准的 PR 实现提交，提交测试报告并推送到同一 feature 分支。不得修改产品实现，不得直接推送 milestone 或默认分支；测试失败如实声明 failed 并交接报告及复现信息。
    model: 
      provider: zai-coding-cn
      modelId: glm-5.3-flash

judgeRole:
  persona: |
    独立检查当前 claim 与真实的工作区/远端事实。绝不修改被评估的产物。ACCEPT 表示确认 claim 可信（节点随后完全按执行者声称的方式结束）；REJECT 必须附带具体说明如何纠正工作的 reason——它会逐字作为纠正指令送达执行者；仅在确实缺少信息时才使用 NEED_CONTEXT。
  model: 
    provider: zai-coding-cn
    modelId: glm-5.3-flash

workflow:
  startNode: plan-milestone
  nodes:
    plan-milestone:
      execution:
        type: actor-task
        role: manager
        instruction: |
          根据当前用户目标规划里程碑交付：选定 Milestone 标题和 milestone 分支名。仅做规划——本节点内不要创建或修改工作区文件、分支或 GitHub对象；下一节点会初始化它们。声明 completed 时，handoff 必须携带仓库（owner/repo 与 origin URL）、milestoneTitle、branchName，以及用户目标的简短复述。
      checker:
        checkerId: judge.claim-correct
        config:
          criteria: |
            用户目标足够清晰、可以交付。handoff 指明了仓库（origin）、非空且可执行的 milestoneTitle 和与目标一致的 branchName，以及目标复述。不要求 PRD、Milestone 或分支此时已经存在。
      onPass: initialize-milestone

    initialize-milestone:
      execution:
        type: builtin-program
        programId: github.initialize-milestone
        instruction: |
          通过 node_run_program 运行 github.initialize-milestone，title 和branchName 逐字取自 plan-milestone 的 handoff；仓库为当前工作区的origin。在运行之前不要写入任何文件——工作树必须仍保持干净。
      onPass: draft-prd

    draft-prd:
      execution:
        type: actor-task
        role: manager
        instruction: |
          工作区现已位于 milestone 分支。在 docs/prd/ 下使用 /to-prd 这个skill 创建或更新 PRD（遵循仓库的 PRD 约定），覆盖用户目标、范围、非目标与验收标准。提交创建的 PRD 文档，务必在声明 completed 之前把该提交推送到远端 milestone 分支。声明completed 时，handoff 必须携带 PRD 路径、PRD 提交、仓库、分支、milestoneTitle 和 milestoneNumber。
      checker:
        checkerId: judge.claim-correct
        config:
          criteria: |
            docs/prd/ 下存在 PRD 文件，且覆盖用户目标、范围、非目标与验收标准。PRD 提交存在于当前 milestone 分支上，且远端 milestone 分支包含该提交。handoff 指明了 PRD 路径、PRD 提交、仓库、分支、milestoneTitle 和 milestoneNumber。不要求默认分支此时已包含 PRD。
      onPass: plan-issues

    plan-issues:
      execution:
        type: actor-task 
        role: manager
        instruction: |
          使用 /to-issues 这个skill创建并组织交付 PRD 所需的 GitHub Issues。使用 `gh issue create` 时， 按标题传 milestone（--milestone "<title>"），而非编号——gh CLI 的 --milestone 参数接受标题，而 `gh api ...?milestone=` 接受编号。声明 completed 时，在 handoff 中继续携带 milestoneTitle 和 milestoneNumber。
      checker:
        checkerId: judge.claim-correct
        config:
          criteria: |
            检查 PRD、 Milestone 与 Issues 是否创建。仅当所需 Issues 覆盖 PRD、每个 Issue 都可执行、且 handoff 携带 milestoneTitle 和 milestoneNumber 时才 PASS。
      onPass: run-issue-cycle

    run-issue-cycle:
      execution:
        type: child-workflow
        workflowId: issue-cycle
      onPass: integrate-milestone

    integrate-milestone:
      execution:
        type: actor-task
        role: manager
        instruction: |
          所有 Issue 已经通过各自 PR 集成到 milestone 分支。现在创建或更新 milestone → 默认分支的集成 PR，
          检查 Milestone 无未关闭 Issue、所有交付与测试报告齐备，满足 CI 和分支保护后合并该 PR。
          必须保留各 Issue 实现与测试报告提交的祖先可达性；仅支持 squash 或需要外部批准时 BLOCK，不绕过限制。
          fetch 后验证远端默认分支包含 milestone 交付修订及所有实现/报告提交。
          completed 的 handoff 携带仓库、PRD 路径、milestoneTitle/Number、milestoneBranch、
          默认分支名、集成 PR URL、milestone 修订和默认分支集成修订，供 final-review 使用。
      checker:
        checkerId: judge.claim-correct
        config:
          criteria: |
            Milestone 无未关闭 Issue，milestone → 默认分支 PR 已合并，所需检查通过，
            远端默认分支按祖先关系包含 milestone 的全部实现和测试报告提交，handoff 的身份与集成证据完整。
      onPass: final-review

    final-review:
      execution:
        type: actor-task
        role: reviewer
        instruction: |
          以远端默认分支作为权威基线（而非 milestone 分支），使用 /review skill对照 PRD 评审已完成的 Milestone。检查 PRD 验收标准、每个 Milestone Issue、每个 Issue 已集成的修订，以及默认分支上的测试报告。评审本身完成后即声明 completed（无论结论如何），并在 handoff 中记录结果，结果中要包含 PRD 路径、 Milestone 编号/标题，以及所评审的默认分支修订。
      checker:
        checkerId: judge.claim-correct
        config:
          criteria: |
            检查是否存在审查报告，报告中是否包含了PRD 路径、 Milestone 编号/标题，以及所评审的默认分支修订这些信息。存在任何阻断性发现时FAIL——handoff 中的发现随后路由到修复流程。
      onPass: close-milestone
      onFail: plan-remediation

    close-milestone:
      execution:
        type: actor-task
        role: manager
        instruction: |
          关闭已交付的 Milestone。先确认终审已被接受且该 Milestone 无未关闭Issue。然后用 `gh api --method PATCH repos/{owner}/{repo}/milestones/{number} -fstate=closed` 关闭——REST API 使用数字 Milestone 编号；不要与`gh issue create --milestone` 的标题语义混淆。声明 completed 时，handoff 必须携带 Milestone URL、编号、标题、最终状态，以及默认分支集成修订。
      checker:
        checkerId: judge.claim-correct
        config:
          criteria: |
            GitHub Milestone 状态为 closed，open_issues 为 0，每个 MilestoneIssue 均已关闭，且 handoff 携带 Milestone URL、编号、标题、状态及默认分支集成修订。全部满足才 PASS——仍处于打开状态的 Milestone必须 FAIL。
      onPass: END
      onFail: plan-remediation

    plan-remediation:
      execution:
        type: actor-task
        role: manager
        instruction: |
          先将 handoff 中来自 final-review（或 close-milestone）的阻断性发现，转化为当前 Milestone 中一个或多个未完成、可执行的修复 Issue，再评估其他非阻断性问题，如果你觉得有必要优化的，也在当前Milestone中创建Issue。声明 completed 时，在 handoff 中继续携带修复 Issue 的 URL。
      checker:
        checkerId: judge.claim-correct
        config:
          criteria: |
            仅当 handoff 中每条阻断性发现都被当前 Milestone 中一个未完成、可执行的 Issue 覆盖时才 PASS。
      onPass: run-issue-cycle

childWorkflows:
  issue-cycle:
    startNode: select-next-issue
    nodes:
      select-next-issue:
        execution:
          type: actor-task
          role: coordinator
          instruction: |
            检查当前 Milestone，选择一个所需的未完成 Issue。在 node_claim 的handoff 中携带 Issue URL，以及本次交付所针对的仓库、milestone 分支和 milestone 编号。处理成功完成后，最后声明 completed 。
        checker:
          checkerId: judge.claim-correct
          config:
            criteria: |
              仅当所选 Issue 存在、未完成、属于当前 Milestone、可执行，且handoff 携带 Issue URL、仓库、milestone 分支和 milestone 编号时才 PASS。
        onPass: deliver-one-issue

      deliver-one-issue:
        execution:
          type: child-workflow
          workflowId: issue-delivery
        onPass: all-issues-complete

      all-issues-complete:
        execution:
          type: builtin-program
          programId: github.all-milestone-issues-complete
          instruction: |
            使用 Manager 对话或 handoff 中的当前 Milestone 编号。
        onPass: END
        onFail: select-next-issue

  issue-delivery:
    startNode: init-issue
    nodes:
      init-issue:
        execution:
          type: actor-task
          role: coordinator
          instruction: |
            初始化当前 Issue 的开发环境。确认 Issue 未关闭且属于当前 Milestone，
            读取 handoff 中的仓库、milestone 分支和编号；工作树不干净或上下文不明时 BLOCK，禁止丢弃用户变更。
            fetch origin，从最新远端 milestone 分支创建并切换到 feat/<issue-number>-<slug>，推送并设置 upstream。
            如同名分支已存在，仅在确认属于本 Issue、基线正确且无冲突工作后复用；否则 BLOCK，禁止强推覆盖。
            后续实现、返工与测试报告均在该 feature 分支进行，禁止直接向 milestone/default 推送实现。
            completed 的 handoff 必须携带 Issue URL/编号、仓库、milestoneTitle/Number、
            milestoneBranch、featureBranch、baseCommit；所有后续节点均须继续传递这些上下文。
        checker:
          checkerId: judge.claim-correct
          config:
            criteria: |
              确认 Issue 未关闭且属于当前 Milestone，当前工作树干净、已切换到指定 feat/... 分支，
              远端 feature 分支存在且跟踪正确，记录的 baseCommit 是初始化时远端 milestone tip 且为 feature 祖先。
              handoff 完整区分 milestoneBranch 与 featureBranch，不得把 milestone 分支作为开发分支。
        onPass: implement

      implement:
        execution:
          type: actor-task
          role: developer
          instruction: |
            仅在 handoff 指定的 featureBranch 实现当前 Issue（包括 Reviewer/Manager/Tester 的返工要求）。
            运行实现级检查，提交并推送到该 feature 分支。创建或更新 PR：head=featureBranch、base=milestoneBranch。
            PR 描述关联 Issue、实现范围和检查结果；不得提前关闭 Issue，不得合并 PR。
            返工复用同一开放 PR；若 PR 已合并/关闭或分支身份不符，BLOCK 交 Manager 处理，不绕过审查。
            completed 时传递初始化上下文、PR URL/编号、base/head、实现提交 implementationCommit 与当前 PR head SHA。
        checker:
          checkerId: judge.claim-correct
          config:
            criteria: |
              实现提交已推送到 feature 分支。
              存在关联该 Issue 的开放 PR，head/base 分别是指定 feature/milestone 分支，PR head SHA 与 handoff 一致。
              handoff 保留初始化上下文、PR 和实现提交；不得以直接推送 milestone 分支代替 PR。
        onPass: review

      review:
        execution:
          type: actor-task
          role: reviewer
          instruction: |
            只读评审当前 PR 对 milestone base 的 diff、Issue 要求及实现级检查，确认 PR 当前 head SHA。
            评审完成生成评审结果，随即声明 completed，无论建议批准还是返工；不要用 failed 表达代码存在问题，failed 代表审查工作有问题而不是代码有问题。
            handoff 必须传递完整 Issue/仓库/Milestone/分支/PR/implementationCommit 上下文，
            并记录 reviewedHead、reviewedBase、approved=yes/no、阻断性发现、证据和建议，交 Manager 决策。
            不合并或批准 GitHub PR，不修改实现。无法完成评审时 BLOCK 并说明缺失的信息。
        checker:
          checkerId: judge.claim-correct
          config:
            criteria: |
              判定的是评审是否真实完整，不是代码是否获批。完成对正确 PR 与确切 head/base 的审查，
              结论和发现有证据、上下文完整，则接受 completed；approved=no 同样应 ACCEPT 并交 Manager 决策。
              PR 身份错误、报告缺失或结论缺乏证据时 REJECT 并要求补充，不能替 Manager 将发现直接路由到 implement。
        onPass: decide-pr

      decide-pr:
        execution:
          type: actor-task
          role: manager
          instruction: |
            根据 Reviewer 报告独立决定当前 PR 是否可进入测试；先核对 PR 仍开放、base/head 正确且 head 未偏离 reviewedHead。
            有阻断问题、审查不完整或 head 变化时声明 failed：outcome=failed，退回原因只在 handoff 开头概括；handoff 必须携带返工所需的
            完整上下文——Issue、PR、两条分支、被退回的 head SHA、每条阻断发现与具体修正要求——引擎将沿 onFail
            把它原样交给 implement；返工内容只写进唯一的 handoff 文本。
            同意时声明 completed，handoff 携带全部交付上下文、审查结论、批准理由和 approvedHead=reviewedHead。
            此处同意是工作流内批准进入测试，不是提前合并；仓库要求的 GitHub review/保护规则仍必须满足。
            禁止绕过平台的自审限制或保护规则；权限或外部批准阻塞使用 BLOCK。测试完成前保持 PR 开放、Issue 未关闭。
        checker:
          checkerId: judge.claim-correct
          config:
            criteria: |
              completed 仅在 Manager 有证据地同意该 PR、无未解决阻断项、PR head 与 reviewedHead/approvedHead 一致，
              且 handoff 包含完整上下文与批准理由时 ACCEPT。合理返工决定使用 failed，handoff 需携带 Issue/PR/分支/SHA、
              阻断发现与可执行修正要求；对可信 failed 应 ACCEPT，使引擎走 onFail；不能以 REJECT 代替业务返工分支。
        onPass: test
        onFail: implement

      test:
        execution:
          type: actor-task
          role: tester
          instruction: |
            在 featureBranch 上验证 PR head 仍为 approvedHead，测试该批准提交，禁止修改产品实现。
            在 docs/test-reports/<issue-number>-<slug>-test-report.md 发布报告，记录 Issue、PR、仓库、两条分支、
            被测 SHA、环境、命令、结果与隔离说明；仅提交报告并推送至同一 feature 分支。
            全部所需测试通过才声明 completed，handoff 传递全部上下文、approvedHead、被测提交、报告路径/提交和最终 PR head。
            测试失败则发布失败报告并声明 failed：outcome=failed，失败结论只在 handoff 开头概括；handoff 携带完整身份、报告路径/提交、
            复现步骤和返工要求，引擎沿 onFail 把它原样交回 implement，修复后必须重新 review → decide-pr → test。
            环境阻塞或未经审查的 head 漂移使用 BLOCK。
        checker:
          checkerId: judge.claim-correct
          config:
            criteria: |
              completed 要求指定批准提交的所需测试全部通过，报告内容齐备且已推送至 feature 分支，
              approvedHead 之后仅新增测试报告变更，没有未经审查的实现修改；handoff 的报告提交与最终 PR head 可验证。
              failed 要求测试失败事实与已发布的失败报告真实齐备，且 handoff 携带完整身份与可执行返工上下文；
              接受可信 failed 走 onFail。未执行测试、未发布报告或错误声称通过时 REJECT；不得把真实测试失败强行纠正为 completed。
        onPass: complete-issue
        onFail: implement

      complete-issue:
        execution:
          type: actor-task
          role: manager
          instruction: |
            仅在 Manager 已批准且测试通过后关闭 Issue。先核对 PR 仍针对 milestoneBranch，当前 head 与测试交接的最终 head 一致，
            approvedHead 后只有测试报告变更；满足最新 head 的 CI、required review 和分支保护要求。
            通过该 PR 将 feature 分支合并到 milestone 分支，禁止直接推送代替 PR，禁止集成到默认分支。
            合并前确认仓库允许保留原始提交的 merge commit 策略；实际结果必须保留实现和报告提交可达性，
            仅允许 squash 或无法满足该验证契约时 BLOCK，不强行绕过。合并后 fetch 验证远端 milestone 包含实现与报告提交，
            然后关闭 Issue 并切回更新后的 milestone 分支，供下一个 Issue 初始化。
            completed 的 handoff 携带完整 Issue/Milestone/仓库/分支上下文、PR URL、合并修订、
            实现和测试报告提交、Issue closed 状态。合并/权限/CI 阻塞使用 BLOCK，不回到已合并 PR 继续开发。
        checker:
          checkerId: judge.claim-correct
          config:
            criteria: |
              PR 已合并至指定 milestone 分支，其合并 head 与测试最终 head 一致，批准与测试证据完整，所需保护检查通过。
              远端 milestone 按祖先关系包含实现和报告提交，Issue 已关闭，当前工作树干净且回到 milestone 分支。
              handoff 包含 PR/集成修订、实现与报告提交及 Issue/Milestone 身份；仅开放 PR、仅推送 feature 或提前关闭 Issue 都不合格。
        onPass: END
